<style>
:root{color-scheme:dark;--bg:#171321;--pink:#f329a5;--purple:#a64cf3;--cyan:#16d7eb;--green:#32d583;--muted:#b9aecb}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 10% 0%,#392143,transparent 45%),var(--bg);color:#fff;font:15px system-ui,-apple-system,Segoe UI,sans-serif}
.app{max-width:760px;margin:auto;min-height:100dvh;display:flex;flex-direction:column}
.hd{padding:14px 14px 10px;position:sticky;top:0;background:#1b1628f5;z-index:5;border-bottom:1px solid #ffffff12}
.brand{font-size:28px;font-weight:900;font-style:italic;text-shadow:2px 2px 0 var(--pink)}.sub{color:var(--muted);font-size:12px}
.row{display:flex;gap:8px;align-items:center}.grow{flex:1;min-width:0}.hidden{display:none!important}
button,input,textarea{font:inherit}button{cursor:pointer;color:var(--btntx,#fff);border:1px solid #645173;border-radius:12px;padding:10px 12px;background:var(--btnbg,#322641)}
button.primary{border:0;background:var(--btnpri,linear-gradient(135deg,var(--pink),var(--purple)));font-weight:800}button.danger{border-color:#a43d64;color:#ff9ab9;background:#322641}
input,textarea{width:100%;background:#0d0a13;border:1px solid #514361;color:#fff;border-radius:12px;padding:12px;outline-color:var(--cyan)}
label{display:block;color:var(--muted);font-size:12px;margin:12px 0 6px}
#q{margin-top:10px;border:2px solid #09070f;box-shadow:3px 3px 0 #000}
.tabs{display:flex;gap:6px;margin-top:10px;background:#0d0a13;border:2px solid #09070f;border-radius:16px;padding:6px}
.tabs button{flex:1;position:relative;padding:8px 2px;font-size:12px;border:0;background:none;color:var(--muted)}
.tabs button span{display:block;font-size:17px}.tabs button.active{background:var(--btnpri,linear-gradient(135deg,var(--pink),var(--purple)));color:var(--btntx,#fff);font-weight:800}
.tabs b{position:absolute;top:0;right:2px;background:var(--cyan);color:#000;font-size:10px;border-radius:9px;padding:1px 5px}.tabs b:empty{display:none}
.status{font-size:12px;margin-top:8px}.good{color:var(--green)}.bad{color:#ff8eb7}
main{padding:14px;flex:1}.list{display:flex;flex-direction:column;gap:9px}
.card,.item{background:#241b35;border:2px solid #09070f;box-shadow:3px 3px 0 #000;border-radius:16px}.pn{padding:14px;margin-bottom:12px}
.item{display:flex;align-items:center;gap:12px;text-align:left;width:100%;padding:12px;color:#fff}.item small{display:block;color:var(--muted);margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.av{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,var(--pink),var(--purple));font-weight:900;flex-shrink:0;object-fit:cover;border:2px solid #09070f}
.av.sm{width:36px;height:36px}.av.big{width:96px;height:96px;font-size:36px}.av.ring{border:3px solid var(--cyan)}
.big{font-size:20px}h2,h3{margin:6px 0}
.rh{margin-bottom:8px;position:sticky;top:0;background:#171321;padding:6px 0;z-index:3}
.messages{display:flex;flex-direction:column;gap:7px;min-height:50vh;padding:10px 0}
.msg{max-width:84%;align-self:flex-start;background:#382d48;padding:8px 11px;border-radius:14px;overflow-wrap:anywhere;white-space:pre-wrap}
.msg.mine{align-self:flex-end;background:linear-gradient(135deg,#963ee0,#d92b9b)}.msg small{display:block;opacity:.7;font-size:10px;margin-top:3px}.msg strong{font-size:12px;color:var(--cyan)}
.pic{max-width:100%;max-height:260px;border-radius:10px;display:block;margin:4px 0}
.compose{display:flex;gap:6px;position:sticky;bottom:0;background:#171321;padding:8px 0 calc(8px + env(safe-area-inset-bottom))}.compose textarea{resize:none;min-height:44px;max-height:110px}
#ov{position:fixed;inset:0;z-index:20}#ov.ovm{background:#000a;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:#241b35;border-radius:20px 20px 0 0;padding:16px;width:100%;max-width:760px;max-height:88dvh;overflow:auto;display:flex;flex-direction:column;gap:8px}
.sv{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;align-items:center}
.svh{position:absolute;top:24px;left:12px;right:12px;z-index:3}.bars{position:absolute;top:10px;left:10px;right:10px;display:flex;gap:4px;z-index:3}
.bars i{flex:1;height:3px;background:#fff4;border-radius:2px;overflow:hidden;position:relative}.bars i.d{background:#fff}.bars i.a::after{content:"";position:absolute;inset:0;background:#fff;animation:p 5s linear forwards;transform-origin:left}
@keyframes p{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.stext{font-size:28px;font-weight:800;text-align:center;padding:30px;overflow-wrap:anywhere}.simg{max-width:100%;max-height:100%;object-fit:contain}.scap{position:absolute;bottom:30px;background:#0009;padding:8px 14px;border-radius:12px;max-width:90%}
.tapl,.tapr{position:absolute;top:80px;bottom:0;z-index:2}.tapl{left:0;width:33%}.tapr{right:0;width:67%}
.sw{display:flex;gap:8px;margin:8px 0}.sw i{width:34px;height:34px;border-radius:50%;border:3px solid transparent;cursor:pointer}.sw i.on{border-color:#fff}
.dot{background:var(--cyan);color:#000;font-size:11px;font-weight:800;border-radius:10px;padding:1px 7px;margin-left:6px}
#toast{position:fixed;top:10px;left:10px;right:10px;max-width:740px;margin:auto;z-index:30;background:linear-gradient(135deg,var(--pink),var(--purple));padding:12px 14px;border-radius:14px;font-weight:700;box-shadow:3px 3px 0 #000;cursor:pointer;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.by{position:absolute;top:0;right:12px;background:linear-gradient(135deg,var(--pink),var(--purple));color:#fff;font-size:11px;font-weight:800;padding:3px 10px 4px;border-radius:0 0 10px 10px;border:2px solid #09070f;border-top:0;box-shadow:2px 2px 0 #000;letter-spacing:.3px}
.credit{text-align:center;color:#9f94b1;font-size:12px;margin-top:14px}.credit b{color:var(--pink)}
html{scroll-behavior:smooth}
.tabs{overflow-x:auto;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}.tabs button{flex:0 0 auto;min-width:64px;white-space:nowrap}
@keyframes in{from{opacity:0;transform:translateY(14px) scale(.985)}to{opacity:1;transform:none}}
@keyframes slin{from{opacity:0;transform:translateX(28px)}to{opacity:1;transform:none}}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
@keyframes pop{from{opacity:0;transform:scale(.92) translateY(6px)}to{opacity:1;transform:none}}
main.anim>*{animation:in .34s cubic-bezier(.2,.8,.2,1) both}main.anim>*:nth-child(2){animation-delay:.05s}main.anim>*:nth-child(3){animation-delay:.1s}main.anim>*:nth-child(n+4){animation-delay:.15s}
main.room>*{animation:slin .28s cubic-bezier(.2,.8,.2,1) both}
.sheet{animation:up .3s cubic-bezier(.2,.8,.2,1)}#ov.ovm{animation:fade .2s ease}@keyframes fade{from{opacity:0}to{opacity:1}}
button{transition:transform .12s,background .25s,box-shadow .25s,opacity .2s}button:active{transform:scale(.95)}.item:active{transform:scale(.985)}
.messages .msg:last-child{animation:pop .24s ease both}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.sgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.sk{position:relative}.sk img{width:100%;border-radius:12px;background:#0d0a13;cursor:pointer}.sk b{position:absolute;top:-4px;right:-4px;background:#a43d64;border-radius:50%;width:20px;height:20px;display:grid;place-items:center;font-size:11px;cursor:pointer}
.stk{width:140px;height:140px;border-radius:14px;display:block;object-fit:cover}.msg.nobg{background:none!important;padding:0}
.mention{color:var(--cyan);font-weight:800}.mine .mention{color:#fff;text-decoration:underline}
.vbtn{background:#0d0a13;border:1px solid #645173;margin:4px 0;width:100%}
#dock{position:fixed;right:10px;bottom:84px;z-index:15;background:#241b35;border:2px solid #09070f;box-shadow:3px 3px 0 #000;border-radius:14px;padding:8px;max-width:240px;animation:in .3s ease}#dock .row button{padding:4px 8px}#dt{font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#mn{display:flex;gap:6px;flex-wrap:wrap;padding:4px 0}#mn button{padding:4px 10px;font-size:13px}
.about a{color:var(--cyan)}.bnr{height:90px;border-radius:12px;background:linear-gradient(135deg,#f329a5,#a64cf3) center/cover;margin-bottom:-34px}
main .card .av.big{position:relative;border:3px solid #241b35}
/* ===== KCAT V16 ===== */
.by{display:flex;gap:8px;white-space:nowrap}
.about p{line-height:1.55}
.nc{font-weight:800}
.nc-red{color:#ff2b2b}.nc-orange{color:#ff8c00}.nc-green{color:#2ecc40}
.nc-white{color:#fff}.nc-gray{color:#808080}.nc-yellow{color:#ffe600}.nc-cream{color:#f5f5dc}.nc-lightblue{color:#7dd3fc}
.nc-black{color:#000;text-shadow:0 0 2px #fff,0 0 6px #fffb}
.nc-navy{color:#000080;text-shadow:0 0 3px #fff,0 0 7px #fff9}
.nc-brown{color:#a52a2a;text-shadow:0 0 4px #fff8}
.nc-darkgray{color:#4a4a4a;text-shadow:0 0 3px #fff,0 0 6px #fff9}
.nc-redmoon{color:#c1121f;text-shadow:0 0 6px #ff4d4d99,0 0 1px #fff5}

const own=(m,k)=>Object.prototype.hasOwnProperty.call(m,k);
const NC_LABEL={red:'Merah',orange:'Oranye',green:'Hijau',rgb:'Merah, Biru, Hijau',white:'Putih',black:'Hitam',gray:'Abu-abu',yellow:'Kuning',brown:'Cokelat',navy:'Navy Blue',cream:'Cream',lightblue:'Biru Muda',darkgray:'Abu-abu Gelap',redmoon:'Merah Darah (eksklusif)',gold:'Emas RGB (eksklusif)'};
/* kode standar (dinormalisasi: tanpa '#', huruf kecil) */
const NC_STD={cff1000:'red',cff8000:'orange',c0aba1d:'green',gamer_123:'rgb',cffcffcff:'white','000000':'black','808080':'gray',cffcff00:'yellow',a52a2a:'brown','000080':'navy',f5f5dc:'cream',ogmember:'lightblue',trooll:'darkgray'};
/* kode eksklusif disimpan sebagai hash SHA-256 agar tidak terbaca di source */
const NC_EXC={'4b8c2333c3e4983f0ac7367d97c57b2873e7422ac2ead0c572514a76d91255a4':'redmoon','f70202e714ed762c80b2d5a07b958940f854a2fa99bf9d877704d058dcceb2b6':'gold'};
const nameHtml=u=>{const n=esc((u&&u.name)||'?'),k=u&&u.nameColor;const tg=u&&TAGS[u.tag]?`<span class="tg" title="${TAGS[u.tag][1]}">${TAGS[u.tag][0]}</span>`:'';return tg+(own(NC_LABEL,k)?`<span class="nc nc-${k}">${n}</span>`:n)};
function paintNames(uid){document.querySelectorAll('.msg[data-uid]').forEach(el=>{if(el.dataset.uid!==uid)return;const s=el.querySelector('strong');if(s){const u=U.get(uid);s.innerHTML=nameHtml({name:s.textContent,nameColor:u&&u.nameColor})}})}
function sha256(str){const b=new TextEncoder().encode(str),l=b.length,w=new Uint32Array(64),K=[],S=[];let p=2,n=0;while(n<64){let ok=1;for(let d=2;d*d<=p;d++)if(p%d===0){ok=0;break}if(ok){if(n<8)S[n]=(Math.pow(p,.5)%1)*4294967296|0;K[n]=(Math.pow(p,1/3)%1)*4294967296|0;n++}p++}
const nb=(l+9+63)>>6,buf=new Uint8Array(nb*64);buf.set(b);buf[l]=128;const dv=new DataView(buf.buffer);dv.setUint32(nb*64-4,(l*8)>>>0);dv.setUint32(nb*64-8,Math.floor(l*8/4294967296));
const R=(x,k)=>(x>>>k)|(x<<(32-k));
for(let i=0;i<nb;i++){for(let j=0;j<16;j++)w[j]=dv.getUint32(i*64+j*4);for(let j=16;j<64;j++){const a=w[j-15],c=w[j-2];w[j]=(w[j-16]+(R(a,7)^R(a,18)^(a>>>3))+w[j-7]+(R(c,17)^R(c,19)^(c>>>10)))|0}
let [a,b2,c,d,e,f,g,h]=S;for(let j=0;j<64;j++){const t1=(h+(R(e,6)^R(e,11)^R(e,25))+((e&f)^(~e&g))+K[j]+w[j])|0,t2=((R(a,2)^R(a,13)^R(a,22))+((a&b2)^(a&c)^(b2&c)))|0;h=g;g=f;f=e;e=(d+t1)|0;d=c;c=b2;b2=a;a=(t1+t2)|0}
S[0]=(S[0]+a)|0;S[1]=(S[1]+b2)|0;S[2]=(S[2]+c)|0;S[3]=(S[3]+d)|0;S[4]=(S[4]+e)|0;S[5]=(S[5]+f)|0;S[6]=(S[6]+g)|0;S[7]=(S[7]+h)|0}
return S.map(x=>(x>>>0).toString(16).padStart(8,'0')).join('')}

/* --- Redeem warna nama --- */
async function redeemName(raw,o){
const k=String(raw).trim().replace(/^#/,'').toLowerCase();let key=own(NC_STD,k)?NC_STD[k]:null,excl=false;
if(!key){const h=sha256(k);if(own(NC_EXC,h)){key=NC_EXC[h];excl=true}}
if(!key)return false;
const done=(t,ok)=>{o.className='status '+(ok?'good':'bad');o.textContent=t};
try{
if(excl){
const r=await runTransaction(db,async t=>{const cr=doc(db,'claims',key),s=await t.get(cr);if(s.exists()&&s.data().uid!==me.uid)return'taken';if(!s.exists())t.set(cr,{uid:me.uid,reward:key,at:serverTimestamp()});t.update(doc(db,'users',me.uid),{nameColor:key});return s.exists()?'again':'new'});
if(r==='taken'){done('Kode eksklusif ini sudah diklaim pengguna lain.');return true}
done(r==='new'?'Redeem berhasil! Warna eksklusif '+NC_LABEL[key]+' sekarang milikmu.':'Kode ini sudah kamu klaim sebelumnya. Warna diterapkan lagi.',true)
}else{await updateDoc(doc(db,'users',me.uid),{nameColor:key});done('Redeem berhasil! Warna nama: '+NC_LABEL[key],true)}
const n=$('#knm');if(n)n.innerHTML=nameHtml({...me,nameColor:key});const l=$('#kncl');if(l)l.textContent='Warna nama saat ini: '+NC_LABEL[key]
}catch(e){done('Gagal redeem: '+e.message)}
return true}

function gibind(r){document.querySelectorAll('[data-prof]').forEach(b=>b.onclick=()=>showProfile(b.dataset.prof));document.querySelectorAll('[data-rmm]').forEach(b=>b.onclick=async()=>{if(!confirm('Keluarkan anggota ini dari grup?'))return;try{await updateDoc(doc(db,'rooms',r.id),{memberUids:arrayRemove(b.dataset.rmm)});closeOv()}catch(e){alert(e.message)}});if($('#gph')){$('#gph').onclick=()=>$('#gpf').click();$('#gpf').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{await updateDoc(doc(db,'rooms',r.id),{photo:await pack(f,256)});closeOv()}catch(x){alert(x.message)}}}}
function groupInfo(r){const adm=r.createdBy===me.uid;
modal(`<div class="row">${av({name:r.name,photo:r.photo},'sm')}<h3 class="grow">${esc(r.name)}</h3></div><p class="sub">${r.memberUids.length} anggota</p>${adm?'<button id="grn">✏️ Ganti nama grup</button><button id="gph">Ganti foto grup</button><input type="file" id="gpf" accept="image/*" class="hidden">':''}<div class="list">${r.memberUids.map(id=>{const u=getU(id);return `<div class="item"><button class="grow item" style="border:0;box-shadow:none;background:none;padding:0" data-prof="${esc(id)}">${av(u,'sm')}<span class="grow">${nameHtml(u)}${id===r.createdBy?' 👑':''}${id===me.uid?' (kamu)':''}<small>${esc(u.kcatId||'')}</small></span></button>${adm&&id!==me.uid?`<button class="danger" data-rmm="${esc(id)}">✕</button>`:''}</div>`}).join('')}</div>${adm?'<label>Tambah anggota (Kcat ID)</label><div class="row"><input id="aid" placeholder="KC-XXXX123"><button class="primary" id="am">Tambah</button></div><div id="ge" class="status bad"></div>':''}<button id="lv" class="danger">Keluar grup</button>${adm?'<button id="dg" class="danger">Bubarkan grup (hapus untuk semua)</button>':''}<hr style="width:100%;border:0;border-top:1px solid #ffffff22">${extra(r)}`);bindExtra(r);gibind(r);
if(adm){$('#grn').onclick=async()=>{const n=(prompt('Nama grup baru:',r.name)||'').trim();if(!n||n===r.name)return;try{await updateDoc(doc(db,'rooms',r.id),{name:n.slice(0,40)});closeOv()}catch(e){alert(e.message)}};$('#am').onclick=async()=>{try{const u=await findKid($('#aid').value);if(!u)return $('#ge').textContent='Kcat ID tidak ditemukan.';if(r.memberUids.includes(u.uid))return $('#ge').textContent='Sudah jadi anggota.';await updateDoc(doc(db,'rooms',r.id),{memberUids:arrayUnion(u.uid)});closeOv()}catch(e){$('#ge').textContent=e.message}};
$('#dg').onclick=async()=>{if(!confirm('Bubarkan grup? Grup dan semua pesan dihapus untuk semua anggota.'))return;try{const ms_=await getDocs(collection(db,'rooms',r.id,'messages'));for(const m of ms_.docs)await delMsg(r.id,m);await deleteDoc(doc(db,'rooms',r.id));closeOv();active=null;render()}catch(e){alert(e.message)}}}
$('#lv').onclick=async()=>{if(!confirm('Keluar dari grup ini?'))return;try{const rest=r.memberUids.filter(x=>x!==me.uid);if(!rest.length)await deleteDoc(doc(db,'rooms',r.id));else{const u={memberUids:arrayRemove(me.uid)};if(adm)u.createdBy=rest[0];await updateDoc(doc(db,'rooms',r.id),u)}closeOv();active=null;render()}catch(e){alert(e.message)}}}
function newGroup(){const cs=(me.contacts||[]).filter(u=>!B().has(u));
modal(`<h3>Buat grup</h3><label>Nama grup</label><input id="gn" maxlength="40"><label>Foto grup (opsional)</label><input type="file" id="gp" accept="image/*"><label>Pilih dari kontak</label><div class="list">${cs.map(u=>{const p=getU(u);return `<label class="item" style="margin:0"><input type="checkbox" class="gc" value="${esc(u)}" style="width:auto"><span class="grow">${esc(p.name)}<small>${esc(p.kcatId||'')}</small></span></label>`}).join('')||'<div class="sub">Belum ada kontak.</div>'}</div><label>Atau Kcat ID (pisah koma)</label><input id="gi" placeholder="KC-AAAA111, KC-BBBB222"><div id="ge" class="status bad"></div><button class="primary" id="gm">Buat</button>`);
$('#gm').onclick=async()=>{try{const n=$('#gn').value.trim();if(!n)return $('#ge').textContent='Nama grup wajib diisi.';const ids=new Set([...document.querySelectorAll('.gc:checked')].map(x=>x.value));for(const k of $('#gi').value.split(',').map(x=>x.trim()).filter(Boolean)){const u=await findKid(k);if(!u)return $('#ge').textContent='Kcat ID tidak ditemukan: '+k;ids.add(u.uid)}ids.delete(me.uid);
let photo='';const gf=$('#gp').files[0];if(gf)photo=await pack(gf,256);const d={type:'group',name:n,photo,memberUids:[me.uid,...ids],createdBy:me.uid,createdAt:serverTimestamp(),lastText:'Grup dibuat',lastAt:serverTimestamp(),lastUid:me.uid};const ref=await addDoc(collection(db,'rooms'),d);if(!rooms.some(r=>r.id===ref.id))rooms.push({id:ref.id,...d,lastAt:Date.now()});closeOv();tab='groups';openRoom(ref.id)}catch(e){$('#ge').textContent='Gagal: '+e.message}}}

async function startPrivate(uid){if(B().has(uid))return alert('Kamu memblokir pengguna ini. Buka Akun untuk mengelola blokir.');
try{const m=[me.uid,uid].sort(),key='dm_'+m.join('_'),ref=doc(db,'rooms',key),s=await getDoc(ref);let d;if(!s.exists()){d={type:'private',memberUids:m,createdBy:me.uid,createdAt:serverTimestamp(),lastText:'',lastAt:serverTimestamp(),lastUid:''};await setDoc(ref,d)}else{d=s.data();if((d.hiddenFor||[]).includes(me.uid)){await updateDoc(ref,{hiddenFor:arrayRemove(me.uid)});d.hiddenFor=d.hiddenFor.filter(x=>x!==me.uid)}}
if(!rooms.some(r=>r.id===key))rooms.push({id:key,...d});tab='chats';openRoom(key)}catch(e){alert('Tidak bisa membuka chat: '+e.message)}}
