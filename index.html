<style>
:root{color-scheme:dark;--bg:#171321;--pink:#f329a5;--purple:#a64cf3;--cyan:#16d7eb;--green:#32d583;--muted:#b9aecb}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 10% 0%,#392143,transparent 45%),var(--bg);color:#fff;font:15px system-ui,-apple-system,Segoe UI,sans-serif}
.app{max-width:760px;margin:auto;min-height:100dvh;display:flex;flex-direction:column}
.hd{padding:14px 14px 10px;position:sticky;top:0;background:#1b1628f5;z-index:5;border-bottom:1px solid #ffffff12}
.brand{font-size:28px;font-weight:900;font-style:italic;text-shadow:2px 2px 0 var(--pink)}.sub{color:var(--muted);font-size:12px}
.row{display:flex;gap:8px;align-items:center}.grow{flex:1;min-width:0}.hidden{display:none!important}
button,input,textarea{font:inherit}button{cursor:pointer;color:var(--btntx,#fff);border:1px solid #645173;border-radius:12px;padding:10px 12px;background:var(--btnbg,#322641)}
button.primary{border:0;background:var(--btnpri,linear-gradient(135deg,var(--pink),var(--purple)));font-weight:800}button.danger{border-color:#a43d64;color:#ff9ab9;background:#322641}
input,textarea{width:100%;background:#0d0a13;border:1px solid #514361;color:#fff;border-radius:12px;padding:12px;outline-color:var(--cyan)}
label{display:block;color:var(--muted);font-size:12px;margin:12px 0 6px}
#q{margin-top:10px;border:2px solid #09070f;box-shadow:3px 3px 0 #000}
.tabs{display:flex;gap:6px;margin-top:10px;background:#0d0a13;border:2px solid #09070f;border-radius:16px;padding:6px}
.tabs button{flex:1;position:relative;padding:8px 2px;font-size:12px;border:0;background:none;color:var(--muted)}
.tabs button span{display:block;font-size:17px}.tabs button.active{background:var(--btnpri,linear-gradient(135deg,var(--pink),var(--purple)));color:var(--btntx,#fff);font-weight:800}
.tabs b{position:absolute;top:0;right:2px;background:var(--cyan);color:#000;font-size:10px;border-radius:9px;padding:1px 5px}.tabs b:empty{display:none}
.status{font-size:12px;margin-top:8px}.good{color:var(--green)}.bad{color:#ff8eb7}
main{padding:14px;flex:1}.list{display:flex;flex-direction:column;gap:9px}
.card,.item{background:#241b35;border:2px solid #09070f;box-shadow:3px 3px 0 #000;border-radius:16px}.pn{padding:14px;margin-bottom:12px}
.item{display:flex;align-items:center;gap:12px;text-align:left;width:100%;padding:12px;color:#fff}.item small{display:block;color:var(--muted);margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.av{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,var(--pink),var(--purple));font-weight:900;flex-shrink:0;object-fit:cover;border:2px solid #09070f}
.av.sm{width:36px;height:36px}.av.big{width:96px;height:96px;font-size:36px}.av.ring{border:3px solid var(--cyan)}
.big{font-size:20px}h2,h3{margin:6px 0}
.rh{margin-bottom:8px;position:sticky;top:0;background:#171321;padding:6px 0;z-index:3}
.messages{display:flex;flex-direction:column;gap:7px;min-height:50vh;padding:10px 0}
.msg{max-width:84%;align-self:flex-start;background:#382d48;padding:8px 11px;border-radius:14px;overflow-wrap:anywhere;white-space:pre-wrap}
.msg.mine{align-self:flex-end;background:linear-gradient(135deg,#963ee0,#d92b9b)}.msg small{display:block;opacity:.7;font-size:10px;margin-top:3px}.msg strong{font-size:12px;color:var(--cyan)}
.pic{max-width:100%;max-height:260px;border-radius:10px;display:block;margin:4px 0}
.compose{display:flex;gap:6px;position:sticky;bottom:0;background:#171321;padding:8px 0 calc(8px + env(safe-area-inset-bottom))}.compose textarea{resize:none;min-height:44px;max-height:110px}
#ov{position:fixed;inset:0;z-index:20}#ov.ovm{background:#000a;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:#241b35;border-radius:20px 20px 0 0;padding:16px;width:100%;max-width:760px;max-height:88dvh;overflow:auto;display:flex;flex-direction:column;gap:8px}
.sv{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;align-items:center}
.svh{position:absolute;top:24px;left:12px;right:12px;z-index:3}.bars{position:absolute;top:10px;left:10px;right:10px;display:flex;gap:4px;z-index:3}
.bars i{flex:1;height:3px;background:#fff4;border-radius:2px;overflow:hidden;position:relative}.bars i.d{background:#fff}.bars i.a::after{content:"";position:absolute;inset:0;background:#fff;animation:p 5s linear forwards;transform-origin:left}
@keyframes p{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.stext{font-size:28px;font-weight:800;text-align:center;padding:30px;overflow-wrap:anywhere}.simg{max-width:100%;max-height:100%;object-fit:contain}.scap{position:absolute;bottom:30px;background:#0009;padding:8px 14px;border-radius:12px;max-width:90%}
.tapl,.tapr{position:absolute;top:80px;bottom:0;z-index:2}.tapl{left:0;width:33%}.tapr{right:0;width:67%}
.sw{display:flex;gap:8px;margin:8px 0}.sw i{width:34px;height:34px;border-radius:50%;border:3px solid transparent;cursor:pointer}.sw i.on{border-color:#fff}
.dot{background:var(--cyan);color:#000;font-size:11px;font-weight:800;border-radius:10px;padding:1px 7px;margin-left:6px}
#toast{position:fixed;top:10px;left:10px;right:10px;max-width:740px;margin:auto;z-index:30;background:linear-gradient(135deg,var(--pink),var(--purple));padding:12px 14px;border-radius:14px;font-weight:700;box-shadow:3px 3px 0 #000;cursor:pointer;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.by{position:absolute;top:0;right:12px;background:linear-gradient(135deg,var(--pink),var(--purple));color:#fff;font-size:11px;font-weight:800;padding:3px 10px 4px;border-radius:0 0 10px 10px;border:2px solid #09070f;border-top:0;box-shadow:2px 2px 0 #000;letter-spacing:.3px}
.credit{text-align:center;color:#9f94b1;font-size:12px;margin-top:14px}.credit b{color:var(--pink)}
html{scroll-behavior:smooth}
.tabs{overflow-x:auto;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}.tabs button{flex:0 0 auto;min-width:64px;white-space:nowrap}
@keyframes in{from{opacity:0;transform:translateY(14px) scale(.985)}to{opacity:1;transform:none}}
@keyframes slin{from{opacity:0;transform:translateX(28px)}to{opacity:1;transform:none}}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}

const own=(m,k)=>Object.prototype.hasOwnProperty.call(m,k);
const NC_LABEL={red:'Merah',orange:'Oranye',green:'Hijau',rgb:'Merah, Biru, Hijau',white:'Putih',black:'Hitam',gray:'Abu-abu',yellow:'Kuning',brown:'Cokelat',navy:'Navy Blue',cream:'Cream',lightblue:'Biru Muda',darkgray:'Abu-abu Gelap',redmoon:'Merah Darah (eksklusif)',gold:'Emas RGB (eksklusif)'};
/* REDEEM WARNA NAMA - KOSONG (reset pabrik).
   Cara menambah: isi NC_STD dengan  kodekecil:'warna'  (kode tanpa '#', huruf kecil semua,
   warna salah satu kunci NC_LABEL di atas, mis. red, orange, green, ...).
   Contoh bentuk (JANGAN dipakai apa adanya):  NC_STD={kodebaru:'red'}  */
const NC_STD={};
/* NC_EXC = kode eksklusif (hash SHA-256 dari kode huruf kecil -> nama warna eksklusif). Kosong. */
const NC_EXC={};
const nameHtml=u=>{const n=esc((u&&u.name)||'?'),k=u&&u.nameColor;const tg=u&&TAGS[u.tag]?`<span class="tg" title="${TAGS[u.tag][1]}">${TAGS[u.tag][0]}</span>`:'';const kp=u&&u.uid&&KP.get(u.uid),kb=kp&&kp.title&&kmOK(kp.title)?kmTbMini(kp.title):'';return kb+tg+(own(NC_LABEL,k)?`<span class="nc nc-${k}">${n}</span>`:n)};
function paintNames(uid){document.querySelectorAll('.msg[data-uid]').forEach(el=>{if(el.dataset.uid!==uid)return;const s=el.querySelector('strong');if(s){const u=U.get(uid);s.innerHTML=nameHtml({name:s.querySelector('.nc')?s.querySelector('.nc').textContent:s.textContent,nameColor:u&&u.nameColor,uid:uid,tag:u&&u.tag})}})}
function sha256(str){const b=new TextEncoder().encode(str),l=b.length,w=new Uint32Array(64),K=[],S=[];let p=2,n=0;while(n<64){let ok=1;for(let d=2;d*d<=p;d++)if(p%d===0){ok=0;break}if(ok){if(n<8)S[n]=(Math.pow(p,.5)%1)*4294967296|0;K[n]=(Math.pow(p,1/3)%1)*4294967296|0;n++}p++}
const nb=(l+9+63)>>6,buf=new Uint8Array(nb*64);buf.set(b);buf[l]=128;const dv=new DataView(buf.buffer);dv.setUint32(nb*64-4,(l*8)>>>0);dv.setUint32(nb*64-8,Math.floor(l*8/4294967296));
const R=(x,k)=>(x>>>k)|(x<<(32-k));
for(let i=0;i<nb;i++){for(let j=0;j<16;j++)w[j]=dv.getUint32(i*64+j*4);for(let j=16;j<64;j++){const a=w[j-15],c=w[j-2];w[j]=(w[j-16]+(R(a,7)^R(a,18)^(a>>>3))+w[j-7]+(R(c,17)^R(c,19)^(c>>>10)))|0}
let [a,b2,c,d,e,f,g,h]=S;for(let j=0;j<64;j++){const t1=(h+(R(e,6)^R(e,11)^R(e,25))+((e&f)^(~e&g))+K[j]+w[j])|0,t2=((R(a,2)^R(a,13)^R(a,22))+((a&b2)^(a&c)^(b2&c)))|0;h=g;g=f;f=e;e=(d+t1)|0;d=c;c=b2;b2=a;a=(t1+t2)|0}
S[0]=(S[0]+a)|0;S[1]=(S[1]+b2)|0;S[2]=(S[2]+c)|0;S[3]=(S[3]+d)|0;S[4]=(S[4]+e)|0;S[5]=(S[5]+f)|0;S[6]=(S[6]+g)|0;S[7]=(S[7]+h)|0}
return S.map(x=>(x>>>0).toString(16).padStart(8,'0')).join('')}

/* --- Redeem warna nama --- */
async function redeemName(raw,o){
const k=String(raw).trim().replace(/^#/,'').toLowerCase();let key=own(NC_STD,k)?NC_STD[k]:null,excl=false;
if(!key){const h=sha256(k);if(own(NC_EXC,h)){key=NC_EXC[h];excl=true}}
if(!key)return false;
const done=(t,ok)=>{o.className='status '+(ok?'good':'bad');o.textContent=t};
try{
if(excl){
const r=await runTransaction(db,async t=>{const cr=doc(db,'claims',key),s=await t.get(cr);if(s.exists()&&s.data().uid!==me.uid)return'taken';if(!s.exists())t.set(cr,{uid:me.uid,reward:key,at:serverTimestamp()});t.update(doc(db,'users',me.uid),{nameColor:key});return s.exists()?'again':'new'});
if(r==='taken'){done('Kode eksklusif ini sudah diklaim pengguna lain.');return true}
done(r==='new'?'Redeem berhasil! Warna eksklusif '+NC_LABEL[key]+' sekarang milikmu.':'Kode ini sudah kamu klaim sebelumnya. Warna diterapkan lagi.',true)
}else{await updateDoc(doc(db,'users',me.uid),{nameColor:key});done('Redeem berhasil! Warna nama: '+NC_LABEL[key],true)}
const n=$('#knm');if(n)n.innerHTML=nameHtml({...me,nameColor:key});const l=$('#kncl');if(l)l.textContent='Warna nama saat ini: '+NC_LABEL[key]
}catch(e){done('Gagal redeem: '+e.message)}
return true}

const hexOk=c=>/^#[0-9a-f]{6}$/i.test(c||'');
function btnVars(c){const n=parseInt(c.slice(1),16),r=n>>16,g=(n>>8)&255,b=n&255,L=.299*r+.587*g+.114*b,d=x=>Math.round(x*.7).toString(16).padStart(2,'0');return{bg:c,pri:'linear-gradient(135deg,'+c+',#'+d(r)+d(g)+d(b)+')',tx:L>150?'#111':'#fff'}}
function applyBtn(c){const s=document.documentElement.style;if(hexOk(c)){const v=btnVars(c);s.setProperty('--btnbg',v.bg);s.setProperty('--btnpri',v.pri);s.setProperty('--btntx',v.tx)}else['--btnbg','--btnpri','--btntx'].forEach(k=>s.removeProperty(k))}
const bgOk=d=>/^data:image\/(jpeg|png|webp);base64,[A-Za-z0-9+\/=]+$/.test(d||'');
function applyBg(d){const b=document.body.style;if(bgOk(d)){b.backgroundImage='linear-gradient(rgba(23,19,33,.5),rgba(23,19,33,.5)),url("'+d+'")';b.backgroundSize='cover';b.backgroundPosition='center';b.backgroundAttachment='fixed';b.backgroundRepeat='no-repeat'}else['backgroundImage','backgroundSize','backgroundPosition','backgroundAttachment','backgroundRepeat'].forEach(k=>b[k]='')}
const applyPrefs=u=>{applyBtn(u&&u.btnColor);applyBg(u&&u.bg)};
async function bgPack(f){let m=1000,qa=.6,d=await imgToData(f,m,qa);while(d.length>180000&&qa>.25){qa-=.1;m*=.85;d=await imgToData(f,m,qa)}if(d.length>180000)throw Error('Gambar terlalu besar/rumit, pilih gambar lain.');return d}

await setDoc(ref,{uid:me.uid,name:me.name,text:'',vid:{n,mb:+(f.size/1048576).toFixed(1)},createdAt:serverTimestamp()});kcPing(r.id,ref.id);
await updateDoc(doc(db,'rooms',r.id),{lastText:'Video',lastAt:serverTimestamp(),lastUid:me.uid,hiddenFor:[]})}
const KCF_MAX=5*1024*1024,KCF_BAD=/\.(exe|apk|apks|xapk|bat|cmd|msi|scr|com|jar|js|vbs|sh|ps1|dll|lnk|hta|reg)$/i,kcDur=s=>{s=Math.max(0,Math.round(+s||0));return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')};
async function sendBlob(r,f,kind,extra){const bb=await blockedBy(r);if(bb)throw Error(bb);const data=await new Promise((ok,no)=>{const fr=new FileReader();fr.onerror=()=>no(Error('Gagal membaca file'));fr.onload=()=>ok(fr.result);fr.readAsDataURL(f)});const n=Math.ceil(data.length/700000),ref=doc(collection(db,'rooms',r.id,'messages'));

const meta={n,mb:+(f.size/1048576).toFixed(2),type:f.type||'',...extra},m={uid:me.uid,name:me.name,text:'',createdAt:serverTimestamp()};m[kind]=meta;await setDoc(ref,m);kcPing(r.id,ref.id);
await updateDoc(doc(db,'rooms',r.id),{lastText:kind==='fl'?'File: '+(meta.name||'file'):(meta.dur?'Pesan suara':'Audio'),lastAt:serverTimestamp(),lastUid:me.uid,hiddenFor:[]})}
async function kcBlobUrl(rid,mid,meta){const key='m'+mid;let u=vcache.get(key);if(u)return u;const c=await getDocs(query(collection(db,'rooms',rid,'messages',mid,'chunks'),orderBy('i')));if(c.size<meta.n)throw Error('Data belum lengkap, coba lagi.');const b=await(await fetch(c.docs.map(d=>d.data().d).join(''))).blob();u=URL.createObjectURL(meta.type?new Blob([b],{type:meta.type}):b);vcache.set(key,u);return u}

let mr=null,st0=0,tm=null,stream=null,blob=null,mime='';const MAXS=120,clean=()=>{clearInterval(tm);try{if(mr&&mr.state!=='inactive'){mr.onstop=null;mr.stop()}}catch(_){}try{stream&&stream.getTracks().forEach(t=>t.stop())}catch(_){}stream=null},msg=t=>{const o=$('#rvm');if(o){o.className='status bad';o.textContent=t}};

 mime=['audio/webm;codecs=opus','audio/mp4','audio/webm','audio/ogg;codecs=opus'].find(x=>MediaRecorder.isTypeSupported(x))||'';const ch=[];
 try{mr=new MediaRecorder(stream,mime?{mimeType:mime,audioBitsPerSecond:32000}:{audioBitsPerSecond:32000})}catch(_){clean();return msg('Perekaman gagal dimulai.')}

 mr.start();st0=Date.now();b.textContent='■ Berhenti';$('#rvk').classList.add('hidden');$('#rvp').innerHTML='';$('#rvm').textContent='';

function rulesScreen(){const R=[['','Saling hormat','Bercanda boleh, tapi jangan sampai merendahkan orang lain. Hinaan, ejekan soal suku, agama, dan ras, serta serangan pribadi tidak dibiarkan.'],['','Jangan spam','Global Chat dibatasi 500 karakter per pesan dan ada jeda 1,5 detik. Jangan banjiri chat, jangan kirim hal yang sama berulang-ulang, dan jangan mention orang tanpa alasan.'],['','Jaga privasi','Jangan menyebar nomor HP, alamat, foto, atau data pribadi orang lain tanpa izin. Jangan juga memberi password atau kode verifikasimu ke siapa pun, termasuk yang mengaku admin.'],['','Konten terlarang','Dilarang konten porno, kekerasan ekstrem, judi, penipuan, dan link berbahaya. Jangan kirim file atau link yang bisa mencuri akun orang.'],['','Akun sendiri','Satu orang, satu akun yang jujur. Jangan menyamar jadi admin atau owner, dan jangan menjual atau meminjamkan akunmu.'],['','Kode redeem','Kode redeem hanya untuk akunmu sendiri. Jangan membagikan kode khusus pengelola, dan jangan menebak kode atau mencari celah buat jadi admin.'],['','Announcement dan komentar','Pengumuman hanya diterbitkan pengelola. Komentar di bawahnya boleh dipakai untuk berpendapat, tapi tetap ikut aturan di atas.'],['','Kalau melanggar','Akun bisa di-kick atau di-ban oleh admin. Ban berlaku sampai ke Gmail yang dipakai, jadi pikir dulu sebelum bikin onar.'],['','Ada yang mengganggu?','Blokir orangnya lewat menu ⋮ di chat pribadi, lalu laporkan ke admin lewat channel yang ada di About us. Sertakan screenshot supaya cepat ditindak.']];
main.innerHTML=`<h2>Aturan Chat</h2><p class="sub">Biar nongkrong di KCAT tetap enak buat semua.</p>${R.map((r,i)=>`<section class="card pn"><h3>${i+1}. ${esc(r[1])}</h3><p>${esc(r[2])}</p></section>`).join('')}<p class="sub" style="text-align:center">Dengan memakai KCAT, kamu setuju dengan aturan ini.</p>`}

function pinWatch(r){if(pinUn){pinUn();pinUn=null}const can=r.type==='private'||r.createdBy===me.uid;pinUn=onSnapshot(doc(db,'rooms',r.id),d=>{const e=$('#pinb');if(!e)return;const p=d.exists()&&d.data().pinned;if(!p){e.className='hidden';e.innerHTML='';return}e.className='status good';e.style.cursor='pointer';e.innerHTML=`<i class="ic ic-pin"></i> <b>${esc(p.name)}</b>: ${esc(p.text)}${can?' <button id="pnx">Lepas</button>':''}`;e.onclick=ev=>{if(ev.target.id==='pnx')return;jumpTo(p.id)};if(can)$S('#pnx').onclick=ev=>{ev.stopPropagation();updateDoc(doc(db,'rooms',r.id),{pinned:null}).catch(x=>tip(fmsg(x.message)))}},()=>{})}

function merpatiHtml(){return `<section class="card pn"><h3>Merpati Perdamaian</h3><p class="sub">Punya ide, kritik, atau saran untuk KCAT? Kirim pesanmu di sini agar tim KCAT dapat membacanya dan membuat platform ini menjadi lebih baik.</p>${me?`<input id="mpn" maxlength="40" placeholder="Nama" value="${esc(me.name||'')}"><textarea id="mpt" rows="4" maxlength="1000" placeholder="Isi pesan (saran, kritik, atau masukan)"></textarea><div id="mps" class="status"></div><button class="primary" onclick="mpSend()">Kirim Saran</button>`:'<p class="sub">Masuk dulu untuk mengirim saran.</p>'}</section>`}

function fmsg(m){m=String(m==null?'':m);if(/Missing or insufficient permissions/i.test(m))return 'Akses ditolak server (izin Firestore). Pastikan firestore.rules v25 sudah di-Publish, lalu muat ulang. Kalau tetap begini, hubungi admin.';if(/INTERNAL ASSERTION FAILED/.test(m)){recover();return 'Koneksi ke server terganggu, menyambungkan ulang…'}return m}

/* ===== KRAICRYPTO (v35) ===== */
/* Harga = fungsi deterministik dari nomor tick (5 detik, waktu server) -> sama untuk semua member.
   v36 (Normal-agak-susah): acak tanpa siklus yang bisa ditebak, tarikan ke harga dasar sangat lemah,
   fee jual 2% + biaya tahan 0,04%/tick (maks 10%). Trader asal-asalan cenderung rugi ~2-3%, trader jeli masih bisa untung tipis. */
const KX={min:100,max:10000,maxPos:3,fee:.02,dec:.0004,decCap:.1,tickMs:5000,base:100,hist:40,win:60,W:220,L:.995,S:.02};
let KXD=null,KXLoad=false,KXErr='',KXOff=0,KXSync=false,KXBusy=false,kxT=null,kxLastTk=0,kxCnt=0;const KXC=new Map(),KXWt=Array.from({length:KX.W},(_,j)=>Math.pow(KX.L,j));
const kxH=(n,s)=>{let h=Math.imul((n|0)^Math.imul((s+1)|0,0x9e3779b1),0x85ebca6b);h^=h>>>15;h=Math.imul(h,0xc2b2ae35);h^=h>>>13;h=Math.imul(h,0x27d4eb2f);h^=h>>>16;return(h>>>0)/4294967296};
const kxZ=k=>{let z=(kxH(k,1)+kxH(k,2)+kxH(k,3)+kxH(k,4)-2)*1.7320508;if(kxH(k,5)<.012)z+=(kxH(k,6)<.5?-1:1)*(2.5+kxH(k,7)*2);return z};
function kxP(n){let v=KXC.get(n);if(v!==undefined)return v;let s=0;for(let j=0;j<KX.W;j++)s+=KXWt[j]*kxZ(n-j);const l=KX.S*s;v=Math.max(5,Math.round(KX.base*Math.exp(l)*100)/100);if(KXC.size>600)KXC.clear();KXC.set(n,v);return v}
const kxNow=()=>Date.now()+KXOff,kxTick=()=>Math.floor(kxNow()/KX.tickMs),kxF=n=>Number(n).toLocaleString('id-ID',{minimumFractionDigits:2,maximumFractionDigits:2}),kxSg=n=>(n>0?'+':'')+kmFmt(n);
async function kxSync(){try{const a=Date.now(),r=await fetch(location.href.split('#')[0],{method:'HEAD',cache:'no-store'}),b=Date.now(),d=r.headers.get('date'),sv=d?new Date(d).getTime():0;if(!sv)throw 0;KXOff=sv+(b-a)/2-b;KXSync=true}catch(_){}return KXSync}
function kxQuote(p,tk){const pe=kxP(p.tk),pn=kxP(tk),g0=Math.floor(p.m*pn/pe),keep=Math.max(1-KX.decCap,1-KX.dec*Math.max(0,tk-p.tk)),gross=Math.floor(g0*keep),sf=gross>0?Math.max(1,Math.ceil(gross*KX.fee)):0,net=Math.max(0,gross-sf);return{pe,pn,gross:g0,fee:g0-net,net,pl:net-p.m}}
const kxOkPos=(p,tk)=>p&&typeof p.id==='string'&&Number.isInteger(p.m)&&p.m>=KX.min&&p.m<=KX.max&&Number.isInteger(p.tk)&&p.tk<=tk;
function kxStart(){KXD=null;KXLoad=false;KXErr='';KXBusy=false;kxSync();
 unsubs.push(onSnapshot(doc(db,'kmCrypto',me.uid),s=>{KXD=s.exists()?s.data():{pos:[],hist:[]};KXLoad=true;KXErr='';if(tab==='kcrypto')kxPaint(true)},e=>{KXErr=e&&e.code==='permission-denied'?'Izin Firestore untuk KraiCrypto (koleksi kmCrypto) belum dipasang.':fmsg(e&&e.message);KXLoad=true;if(tab==='kcrypto')kxPaint(true)}))}
async function kxBuy(m){m=Math.floor(+m);if(!(m>=KX.min&&m<=KX.max))throw Error('Modal harus '+kmFmt(KX.min)+' - '+kmFmt(KX.max)+' KC.');if(!KXSync)throw Error('Waktu server belum tersinkron. Coba lagi sebentar.');if(!KXLoad||KXErr)throw Error(KXErr||'Data belum siap.');if(KXBusy)throw Error('Transaksi sedang diproses.');KXBusy=true;
 try{const wr=doc(db,'wallets',me.uid),cr=doc(db,'kmCrypto',me.uid),tx=kmTid(),pid=kmTid();let ep=0;
  await runTransaction(db,async t=>{const tk=kxTick(),[w,c]=await Promise.all([t.get(wr),t.get(cr)]);if(!w.exists())throw Error('Dompet belum siap.');const b=w.data().balance;if(!Number.isFinite(b)||b<m)throw Error('Saldo KraiCoin tidak cukup.');
   const d=c.exists()?c.data():{},pos=Array.isArray(d.pos)?d.pos:[];if(pos.length>=KX.maxPos)throw Error('Maksimal '+KX.maxPos+' posisi aktif.');ep=kxP(tk);
   t.update(wr,{balance:b-m,lastTx:tx});t.set(cr,{uid:me.uid,pos:[...pos,{id:pid,m,tk,ep,at:kxNow()}],hist:Array.isArray(d.hist)?d.hist:[],lastTx:tx});
   t.set(doc(db,'wallets',me.uid,'tx',tx),{uid:me.uid,type:'crypto',amount:-m,item:pid,note:'Buy KRAI @ '+kxF(ep),at:serverTimestamp()})});return ep}finally{KXBusy=false}}
async function kxSell(pid){if(!KXSync)throw Error('Waktu server belum tersinkron. Coba lagi sebentar.');if(KXBusy)throw Error('Transaksi sedang diproses.');KXBusy=true;
 try{const wr=doc(db,'wallets',me.uid),cr=doc(db,'kmCrypto',me.uid),tx=kmTid();let q=null;
  await runTransaction(db,async t=>{const tk=kxTick(),[w,c]=await Promise.all([t.get(wr),t.get(cr)]);if(!w.exists())throw Error('Dompet belum siap.');if(!c.exists())throw Error('Posisi tidak ditemukan.');const d=c.data(),pos=Array.isArray(d.pos)?d.pos:[],p=pos.find(x=>x&&x.id===pid);
   if(!p)throw Error('Posisi sudah ditutup.');if(!kxOkPos(p,tk))throw Error('Data posisi tidak valid.');if(p.tk>=tk)throw Error('Posisi baru dibuka. Tunggu harga berikutnya (maks 5 detik).');
   q=kxQuote(p,tk);const b=w.data().balance;if(!Number.isFinite(b))throw Error('Saldo tidak valid.');

{const i=SONGS.findIndex(x=>x.id===lsGet('kcat_lyr_song'));if(i>=0)cur=i}

function layout(){

  const m=Math.min(100,W*.1),fx=rnd(m,W-m),fy=rnd(70,Math.max(100,Math.min(350,H*.4))),col=COLS[Math.random()*3|0];
