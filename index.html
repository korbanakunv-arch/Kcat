<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<link rel="manifest" href="manifest.json">

<title>Kcat</title>
<style>
:root{
  color-scheme:dark;
  --bg:#171321;
  --pink:#f329a5;
  --purple:#a64cf3;
  --cyan:#16d7eb;
  --green:#32d583;
  --muted:#b9aecb;
  --btn-bg:#322641;
  --btn-border:#645173;
  --app-bg-img:none;
}
*{box-sizing:border-box}
body{
  margin:0;
  background:var(--app-bg-img), radial-gradient(ellipse at 10% 0%,#392143,transparent 45%),var(--bg);
  background-size:cover;
  background-attachment:fixed;
  color:#fff;
  font:15px system-ui,-apple-system,Segoe UI,sans-serif
}
.app{max-width:760px;margin:auto;min-height:100dvh;display:flex;flex-direction:column}
.hd{padding:14px;position:sticky;top:0;background:#1b1628f5;z-index:5;border-bottom:1px solid #ffffff12;display:flex;flex-direction:column;gap:8px}
.hd-top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.brand{font-size:26px;font-weight:900;font-style:italic;text-shadow:2px 2px 0 var(--pink)}
.sub{color:var(--muted);font-size:12px}
.row{display:flex;gap:8px;align-items:center}.grow{flex:1;min-width:0}.hidden{display:none!important}
button,input,textarea,select{font:inherit}
button{cursor:pointer;color:#fff;border:1px solid var(--btn-border);border-radius:12px;padding:10px 12px;background:var(--btn-bg);transition:transform .12s, background .25s}
button:active{transform:scale(.95)}
button.primary{border:0;background:linear-gradient(135deg,var(--pink),var(--purple));font-weight:800}
button.danger{border-color:#a43d64;color:#ff9ab9}
input,textarea,select{width:100%;background:#0d0a13;border:1px solid #514361;color:#fff;border-radius:12px;padding:12px;outline-color:var(--cyan)}
label{display:block;color:var(--muted);font-size:12px;margin:12px 0 6px}
#q{margin-top:4px;border:2px solid #09070f;box-shadow:3px 3px 0 #000}
.tabs{display:flex;gap:6px;margin-top:6px;background:#0d0a13;border:2px solid #09070f;border-radius:16px;padding:6px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:0 0 auto;min-width:64px;white-space:nowrap;position:relative;padding:8px 10px;font-size:12px;border:0;background:none;color:var(--muted)}
.tabs button span{display:block;font-size:17px}.tabs button.active{background:linear-gradient(135deg,var(--pink),var(--purple));color:#fff;font-weight:800;border-radius:10px}
.tabs b{position:absolute;top:0;right:2px;background:var(--cyan);color:#000;font-size:10px;border-radius:9px;padding:1px 5px}.tabs b:empty{display:none}
.status{font-size:12px;margin-top:8px}.good{color:var(--green)}.bad{color:#ff8eb7}
main{padding:14px;flex:1}.list{display:flex;flex-direction:column;gap:9px}
.card,.item{background:#241b35e6;border:2px solid #09070f;box-shadow:3px 3px 0 #000;border-radius:16px}.pn{padding:14px;margin-bottom:12px}
.item{display:flex;align-items:center;gap:12px;text-align:left;width:100%;padding:12px;color:#fff}.item small{display:block;color:var(--muted);margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.av{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,var(--pink),var(--purple));font-weight:900;flex-shrink:0;object-fit:cover;border:2px solid #09070f}
.av.sm{width:36px;height:36px}.av.big{width:96px;height:96px;font-size:36px}.av.ring{border:3px solid var(--cyan)}
.rh{margin-bottom:8px;position:sticky;top:0;background:#171321f5;padding:6px 0;z-index:3}
.messages{display:flex;flex-direction:column;gap:7px;min-height:50vh;padding:10px 0}
.msg{max-width:84%;align-self:flex-start;background:#382d48;padding:8px 11px;border-radius:14px;overflow-wrap:anywhere;white-space:pre-wrap}
.msg.mine{align-self:flex-end;background:linear-gradient(135deg,#963ee0,#d92b9b)}.msg small{display:block;opacity:.7;font-size:10px;margin-top:3px}.msg strong{font-size:12px;color:var(--cyan)}
.pic{max-width:100%;max-height:260px;border-radius:10px;display:block;margin:4px 0}
.compose{display:flex;gap:6px;position:sticky;bottom:0;background:#171321f5;padding:8px 0 calc(8px + env(safe-area-inset-bottom))}.compose textarea{resize:none;min-height:44px;max-height:110px}
#ov{position:fixed;inset:0;z-index:20}#ov.ovm{background:#000a;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:#241b35;border-radius:20px 20px 0 0;padding:16px;width:100%;max-width:760px;max-height:88dvh;overflow:auto;display:flex;flex-direction:column;gap:8px}
.by{background:linear-gradient(135deg,var(--pink),var(--purple));color:#fff;font-size:11px;font-weight:800;padding:3px 8px;border-radius:8px;border:1px solid #09070f}
.credit{text-align:center;color:#9f94b1;font-size:12px;margin-top:14px}.credit b{color:var(--pink)}
#dock{position:fixed;right:10px;bottom:84px;z-index:15;background:#241b35;border:2px solid #09070f;box-shadow:3px 3px 0 #000;border-radius:14px;padding:8px;max-width:240px}#dock .row button{padding:4px 8px}#dt{font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.about a{color:var(--cyan)}
.sub-nav{display:flex;gap:8px;margin-bottom:12px}.sub-nav button{flex:1;padding:8px}
/* Color styles */
.name-gamer{background:linear-gradient(90deg,red,blue,green);-webkit-background-clip:text;-webkit-text-fill-color:transparent;animation:rainbow 3s infinite linear;font-weight:bold}
.name-hunter{background:linear-gradient(90deg,#ffd700,#fff8dc,#ffa500);-webkit-background-clip:text;-webkit-text-fill-color:transparent;font-weight:bold;text-shadow:0 0 5px rgba(255,215,0,0.8)}
.name-redmoon{color:#8b0000;text-shadow:0 0 6px #ff0000;font-weight:bold}
@keyframes rainbow{0%{filter:hue-rotate(0deg)}100%{filter:hue-rotate(360deg)}}
#toast{position:fixed;top:10px;left:10px;right:10px;max-width:740px;margin:auto;z-index:30;background:linear-gradient(135deg,var(--pink),var(--purple));padding:12px 14px;border-radius:14px;font-weight:700;box-shadow:3px 3px 0 #000;cursor:pointer;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
</style>
</head>
<body>
<script nomodule>document.addEventListener('DOMContentLoaded',function(){document.getElementById('main').innerHTML='<section class="card pn"><h2>Browser tidak didukung</h2><p>Buka Kcat di Chrome versi terbaru.</p></section>'})</script>

<div class="app">

<script type="module">
const sdkSets=[
  ['https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js','https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js','https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js'],
  ['https://cdn.jsdelivr.net/npm/firebase@11.10.0/app/+esm','https://cdn.jsdelivr.net/npm/firebase@11.10.0/auth/+esm','https://cdn.jsdelivr.net/npm/firebase@11.10.0/firestore/+esm']
];
let SDK=null,sdkErr=null;
for(const set of sdkSets){try{SDK=await Promise.all(set.map(u=>import(u)));break}catch(e){sdkErr=e}}
if(!SDK){document.getElementById('main').innerHTML='<section class="card pn"><h2>Gagal memuat Firebase</h2><p class="sub bad">'+String(sdkErr&&sdkErr.message||sdkErr)+'</p></section>';throw sdkErr}

const {initializeApp,getApps}=SDK[0],
      {getAuth,initializeAuth,indexedDBLocalPersistence,browserLocalPersistence,browserSessionPersistence,inMemoryPersistence,onAuthStateChanged,createUserWithEmailAndPassword,signInWithEmailAndPassword,signOut,updateProfile}=SDK[1],
      {getFirestore,initializeFirestore,enableNetwork,doc,setDoc,getDoc,collection,addDoc,getDocs,query,where,orderBy,onSnapshot,serverTimestamp,deleteDoc,updateDoc,arrayUnion,arrayRemove,limit}=SDK[2];

window.__kcatLoaded=true;
const defaultConfig={apiKey:'AIzaSyCBMmtEoOqy_HQ4QIxXB8jxivT86IRDqC0',authDomain:'kcat-10a8f.firebaseapp.com',projectId:'kcat-10a8f',storageBucket:'kcat-10a8f.firebasestorage.app',messagingSenderId:'357416876079',appId:'1:357416876079:web:8a810955a0ba45623d6eda'};

const $=s=>document.querySelector(s),main=$('#main'),hd=$('#hd'),ov=$('#ov');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

let auth,db,me=null,tab='about',aboutSubTab='info',active=null,rooms=[],stats=[],unsubs=[],msgUnsub=null,q='',pend='',U=new Map(),asked=new Set(),seen={},primed=false;
let pl=[],pi=-1;

try{seen=JSON.parse(localStorage.getItem('kseen')||'{}')}catch(_){}
try{pl=JSON.parse(localStorage.getItem('kmusic')||'[]')}catch(_){}

const C=()=>new Set(me?.contacts||[]),B=()=>new Set(me?.blockedUids||[]);
const ms=t=>t&&t.toMillis?t.toMillis():(typeof t==='number'?t:Date.now());
const T=t=>new Date(ms(t)).toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit'});
const st=(s,ok)=>{const c=$('#conn');if(c){c.textContent=s;c.className='status '+(ok?'good':'bad')}};

function getColoredNameHTML(name, colorCode){
  const safeName = esc(name);
  if(!colorCode) return safeName;
  if(colorCode==='#gamer_123') return `<span class="name-gamer">${safeName}</span>`;
  if(colorCode==='#BusanaTheHunter') return `<span class="name-hunter">${safeName}</span>`;
  if(colorCode==='#theredfullmoon') return `<span class="name-redmoon">${safeName}</span>`;
  if(colorCode==='#OGmember') return `<span style="color:#87ceeb;font-weight:bold">${safeName}</span>`;
  if(colorCode==='#trooll') return `<span style="color:#555555;font-weight:bold">${safeName}</span>`;
  return `<span style="color:${esc(colorCode)}">${safeName}</span>`;
}

const av=(u,c='')=>u&&u.photo?`<img class="av ${c}" src="${esc(u.photo)}">`:`<span class="av ${c}">${esc(((u&&u.name)||'?')[0].toUpperCase())}</span>`;

function modal(h){ov.className='ovm';ov.innerHTML=`<div class="sheet">${h}<button id="mc">Tutup</button></div>`;$('#mc').onclick=closeOv;ov.onclick=e=>{if(e.target===ov)closeOv()}}
function closeOv(){ov.className='hidden';ov.innerHTML=''}

function init(){
  try{
    const a=getApps().find(x=>x.name==='kcat')||initializeApp(defaultConfig,'kcat');
    auth=getAuth(a);
    db=getFirestore(a);
    st('Terhubung ke Firebase…',true);

    onAuthStateChanged(auth,async u=>{
      if(!u){
        hd.classList.add('hidden');
        st('Silakan login atau daftar.',true);
        return authScreen();
      }
      const ref=doc(db,'users',u.uid);
      let s=await getDoc(ref);
      if(!s.exists()){
        await setDoc(ref,{
          uid:u.uid,
          name:pend||u.displayName||u.email.split('@')[0],
          kcatId:'KC-'+Math.random().toString(36).slice(2,6).toUpperCase(),
          bio:'Halo, aku memakai Kcat',
          photo:'',
          colorCode:'',
          contacts:[],
          blockedUids:[],
          createdAt:serverTimestamp()
        });
      }
      onSnapshot(ref,docSnap=>{
        if(!docSnap.exists()) return;
        me={...docSnap.data(),uid:u.uid};
        U.set(u.uid,me);
        if(me.bgUrl) document.documentElement.style.setProperty('--app-bg-img', `url('${me.bgUrl}')`);
        if(me.btnColor) document.documentElement.style.setProperty('--btn-bg', me.btnColor);
        hd.classList.remove('hidden');
        st('Online sebagai '+me.name,true);
        render();
      });
    });
  }catch(e){st('Gagal inisialisasi: '+e.message)}
}

function authScreen(err=''){
  main.innerHTML=`<section class="card pn">
    <h2>Masuk ke Kcat</h2>
    <div id="ae" class="status bad">${esc(err)}</div>
    <label>Nama Pengguna</label><input id="name" placeholder="Nama kamu">
    <label>Email</label><input id="email" type="email" placeholder="nama@email.com">
    <label>Password</label><input id="pw" type="password" placeholder="Minimal 6 karakter">
    <div class="row" style="margin-top:14px">
      <button class="primary grow" id="reg">Daftar</button>
      <button class="grow" id="log">Login</button>
    </div>
  </section>`;
  $('#reg').onclick=async()=>{
    try{
      pend=$('#name').value.trim();
      await createUserWithEmailAndPassword(auth,$('#email').value.trim(),$('#pw').value);
    }catch(e){$('#ae').textContent=e.message}
  };
  $('#log').onclick=async()=>{
    try{
      await signInWithEmailAndPassword(auth,$('#email').value.trim(),$('#pw').value);
    }catch(e){$('#ae').textContent=e.message}
  };
}

$('#btn-settings').onclick=()=>{
  modal(`
    <h3>⚙️ Setting</h3>
    <button id="st-profile" style="width:100%;margin-bottom:8px">👤 Profil Saya</button>
    <label>Change Button Color (Warna Tombol)</label>
    <div class="row">
      <input type="color" id="btn-col-picker" value="#322641">
      <button id="btn-col-apply" class="primary">Terapkan Warna</button>
    </div>
  `);
  $('#st-profile').onclick=()=>{closeOv();tab='account';render()};
  $('#btn-col-apply').onclick=async()=>{
    const c=$('#btn-col-picker').value;
    document.documentElement.style.setProperty('--btn-bg',c);
    if(me) await updateDoc(doc(db,'users',me.uid),{btnColor:c});
    closeOv();
  };
};

function render(){
  if(!me) return;
  document.querySelectorAll('#tabs [data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));
  if(tab==='about') aboutScreen();
  else if(tab==='chats') listRooms('private','Chat');
  else if(tab==='groups') listRooms('group','Grup');
  else if(tab==='account') accountScreen();
  else if(tab==='music') musicScreen();
  else main.innerHTML=`<section class="card pn"><h3>Tab ${tab}</h3><p class="sub">Fitur dalam pengembangan.</p></section>`;
}

$('#tabs').onclick=e=>{
  const b=e.target.closest('[data-tab]');
  if(b){tab=b.dataset.tab;render();}
};

function accountScreen(){
  main.innerHTML=`
    <section class="card pn" style="text-align:center">
      ${av(me,'big')}
      <h2 style="margin-top:8px">${getColoredNameHTML(me.name, me.colorCode)}</h2>

    <section class="card pn">

        <option value="#a52a2a" ${me.colorCode==='#a52a2a'?'selected':''}>Brown (#a52a2a)</option>
        <option value="#000080" ${me.colorCode==='#000080'?'selected':''}>Navy Blue (#000080)</option>
        <option value="#f5f5dc" ${me.colorCode==='#f5f5dc'?'selected':''}>Cream (#f5f5dc)</option>

    render();

  $('#btn-redeem').onclick=async()=>{
    const code=$('#acc-redeem-code').value.trim();
    const msg=$('#rd-msg');
    if(!code) return;

    if(code==='#theredfullmoon' || code==='#BusanaTheHunter'){
      try{
        const rRef=doc(db,'claimedCodes',code);
        const snap=await getDoc(rRef);
        if(snap.exists() && snap.data().claimedBy !== me.uid){
          msg.className='status bad';
          msg.textContent='Kode ini sudah di-redeem oleh orang lain!';
          return;
        }
        await setDoc(rRef,{claimedBy:me.uid,claimedAt:serverTimestamp()});
        await updateDoc(doc(db,'users',me.uid),{colorCode:code});
        msg.className='status good';
        msg.textContent='Berhasil Redeem warna eksklusif!';
        render();
      }catch(e){
        msg.className='status bad';
        msg.textContent='Gagal: '+e.message;
      }
    } else {
      msg.className='status bad';
      msg.textContent='Kode Redeem tidak valid.';
    }
  };

  $('#btn-logout').onclick=()=>signOut(auth);
}

function listRooms(type,title){
  main.innerHTML=`<h2>${title}</h2><p class="sub">Belum ada obrolan ${title.toLowerCase()}.</p>`;
}

const bgm=$('#bgm');
function musicScreen(){
  main.innerHTML=`
    <section class="card pn">
      <h3>🎵 Music Player</h3>
      <label>Tambah Lagu (URL MP3 / Youtube)</label>
      <div class="row">
        <input id="m-url" placeholder="https://...">
        <button id="m-add" class="primary">Tambah</button>
      </div>
    </section>
    <div class="list">
      ${pl.map((t,i)=>`
        <div class="item">
          <span class="grow"><b>${esc(t.title)}</b></span>
          <button data-play="${i}">${i===pi?'Pause':'Play'}</button>
        </div>
      `).join('')||'<div class="card pn sub">Belum ada musik tersimpan.</div>'}
    </div>
  `;

  $('#m-add').onclick=()=>{
    const u=$('#m-url').value.trim();
    if(u){
      pl.push({title:'Musik '+(pl.length+1),url:u});
      localStorage.setItem('kmusic',JSON.stringify(pl));
      musicScreen();
    }
  };

  main.querySelectorAll('[data-play]').forEach(b=>{
    b.onclick=()=>{
      const idx=+b.dataset.play;
      if(pi===idx && !bgm.paused){
        bgm.pause();
        pi=-1;
      } else {
        pi=idx;
        bgm.src=pl[idx].url;
        bgm.play().catch(e=>alert('Gagal memutar audio: '+e.message));
        $('#dock').classList.remove('hidden');
        $('#dt').textContent='♪ '+pl[idx].title;
      }
      musicScreen();
    };
  });
}

$('#dp').onclick=()=>{
  if(bgm.paused) bgm.play();
  else bgm.pause();
};
$('#dn').onclick=()=>{
  if(pl.length>0){
    pi=(pi+1)%pl.length;
    bgm.src=pl[pi].url;
    bgm.play().catch(()=>{});
    $('#dt').textContent='♪ '+pl[pi].title;
  }
};
$('#dx').onclick=()=>{
  bgm.pause();
  $('#dock').classList.add('hidden');
};

init();
</script>
</body>
</html>
