$('#go').onclick=async()=>{const out=$('#res');out.innerHTML='<div class="sub">Mencari…</div>';try{const u=await findKid($('#kid').value);if(!u)return out.innerHTML='<div class="sub bad" style="margin-top:8px">Kcat ID tidak ditemukan.</div>';if(u.uid===me.uid)return out.innerHTML='<div class="sub" style="margin-top:8px">Itu ID kamu sendiri 😄</div>';
lastU=u;showRes(u)}catch(e){out.innerHTML='<div class="sub bad">Gagal: '+esc(e.message)+'</div>'}};
main.querySelectorAll('[data-chat]').forEach(b=>b.onclick=()=>startPrivate(b.dataset.chat));
main.querySelectorAll('[data-rm]').forEach(b=>b.onclick=async()=>{if(confirm('Hapus dari kontak?'))await updateDoc(doc(db,'users',me.uid),{contacts:arrayRemove(b.dataset.rm)})});if(lastU)showRes(lastU)}

function statusScreen(){const vis=stats.filter(s=>s.expiresAt>Date.now()&&(s.uid===me.uid||(C().has(s.uid)&&!B().has(s.uid)))),g={};vis.forEach(s=>(g[s.uid]=g[s.uid]||[]).push(s));Object.values(g).forEach(a=>a.sort((x,y)=>x.at-y.at));
const mine=g[me.uid]||[],others=Object.keys(g).filter(u=>u!==me.uid).sort((a,b)=>g[b].slice(-1)[0].at-g[a].slice(-1)[0].at);
main.innerHTML=`<div class="item" style="margin-bottom:12px">${av(me,mine.length?'ring':'')}<span class="grow"><strong>Status saya</strong><small>${mine.length?mine.length+' status · '+T(mine.slice(-1)[0].at):'Ketuk + untuk menambah'}</small></span>${mine.length?'<button id="vm">Lihat</button>':''}<button class="primary" id="ns">＋</button></div><h3>Pembaruan</h3><div class="list">${others.map(u=>{const p=getU(u);return `<button class="item" data-su="${esc(u)}">${av(p,'ring')}<span class="grow"><strong>${esc(p.name)}</strong><small>${g[u].length} status · ${T(g[u].slice(-1)[0].at)}</small></span></button>`}).join('')||'<div class="card pn sub">Belum ada status dari kontakmu. Simpan teman ke Kontak agar statusnya muncul.</div>'}</div>`;
$('#ns').onclick=newStatus;if($('#vm'))$('#vm').onclick=()=>viewer(mine,0);main.querySelectorAll('[data-su]').forEach(b=>b.onclick=()=>viewer(g[b.dataset.su],0))}
function viewer(items,i){clearTimeout(timer);if(i<0||i>=items.length)return closeOv();const s=items[i],u=getU(s.uid);ov.className='ovf';ov.style.background='#000';
ov.innerHTML=`<div class="sv" style="background:${s.type==='text'?esc(s.bg):'#000'}"><div class="bars">${items.map((_,k)=>`<i class="${k<i?'d':k===i?'a':''}"></i>`).join('')}</div><div class="row svh">${av(u,'sm')}<div class="grow"><strong>${esc(u.name)}</strong><div class="sub">${T(s.at)}</div></div>${s.uid===me.uid?'<button id="sd">🗑</button>':''}<button id="sx">✕</button></div>${s.type==='text'?`<div class="stext">${esc(s.text)}</div>`:s.type==='video'?`<div id="vl" class="sub">Memuat video…</div><video id="vid" class="simg hidden" playsinline autoplay controls></video>${s.text?`<div class="scap">${esc(s.text)}</div>`:''}`:`<img class="simg" src="${esc(s.img)}">${s.text?`<div class="scap">${esc(s.text)}</div>`:''}`}<div class="tapl"></div><div class="tapr"></div></div>`;
$('#sx').onclick=closeOv;ov.querySelector('.tapl').onclick=()=>viewer(items,i-1);ov.querySelector('.tapr').onclick=()=>viewer(items,i+1);
if($('#sd'))$('#sd').onclick=async()=>{if(confirm('Hapus status ini?')){try{await delStatus(s)}catch(e){alert(e.message)}closeOv()}};if(s.type==='video')loadVid(s,items,i);else timer=setTimeout(()=>viewer(items,i+1),5000)}
async function loadVid(s,items,i){try{let u=vcache.get(s.id);if(!u){const c=await getDocs(query(collection(db,'statuses',s.id,'chunks'),orderBy('i')));const b=await (await fetch(c.docs.map(d=>d.data().d).join(''))).blob();u=URL.createObjectURL(b);vcache.set(s.id,u)}const v=$('#vid');if(!v)return;$('#vl').remove();v.src=u;v.className='simg';v.onended=()=>viewer(items,i+1);v.play&&v.play().catch(()=>{})}catch(e){if($('#vl'))$('#vl').textContent='Gagal memuat video: '+e.message;timer=setTimeout(()=>viewer(items,i+1),3000)}}
async function delStatus(s){if(s.type==='video'){const c=await getDocs(collection(db,'statuses',s.id,'chunks'));await Promise.all(c.docs.map(d=>deleteDoc(d.ref)))}await deleteDoc(doc(db,'statuses',s.id))}
async function cleanup(){try{const m=await getDocs(query(collection(db,'statuses'),where('uid','==',me.uid)));for(const d of m.docs){const x={id:d.id,...d.data()};if(x.expiresAt<Date.now())await delStatus(x)}}catch(_){}}
function newStatus(){const bgs=['linear-gradient(135deg,#f329a5,#a64cf3)','linear-gradient(135deg,#16d7eb,#3b5bdb)','linear-gradient(135deg,#32d583,#0b7a4b)','linear-gradient(135deg,#ff9a3c,#e8453c)','linear-gradient(135deg,#444,#111)'];let mode='text',bg=bgs[0],img='',vfile=null;
modal(`<h3>Status baru</h3><div class="row"><button class="grow primary" id="mt">Teks</button><button class="grow" id="mi">Foto</button><button class="grow" id="mv">Video</button></div><div id="sb"></div><div id="se" class="status bad"></div><button class="primary" id="sp">Kirim status</button>`);
const body=()=>{$('#mt').className='grow'+(mode==='text'?' primary':'');$('#mi').className='grow'+(mode==='image'?' primary':'');$('#mv').className='grow'+(mode==='video'?' primary':'');
if(mode==='text'){$('#sb').innerHTML=`<textarea id="st" rows="4" maxlength="300" placeholder="Tulis status…"></textarea><div class="sw">${bgs.map(b=>`<i data-bg="${b}" style="background:${b}" class="${b===bg?'on':''}"></i>`).join('')}</div>`;$('#sb').querySelectorAll('[data-bg]').forEach(i=>i.onclick=()=>{bg=i.dataset.bg;body()})}
else if(mode==='video'){$('#sb').innerHTML=`<input type="file" id="vf" accept="video/*" style="margin-top:8px"><video id="vp" class="pic hidden" controls playsinline></video><input id="sc" maxlength="100" placeholder="Keterangan (opsional)" style="margin-top:6px"><div class="sub">Maks 4 MB dan 30 detik (disimpan langsung di Firestore).</div>`;$('#vf').onchange=e=>{const f=e.target.files[0];vfile=null;if(!f)return;if(f.size>4*1024*1024){e.target.value='';return $('#se').textContent='Video terlalu besar ('+(f.size/1048576).toFixed(1)+' MB). Maks 4 MB.'}const u=URL.createObjectURL(f),v=$('#vp');v.src=u;v.className='pic';v.onloadedmetadata=()=>{if(v.duration>31){$('#se').textContent='Video terlalu panjang. Maks 30 detik.';e.target.value='';v.className='hidden'}else{vfile=f;$('#se').textContent=''}}}}
else{$('#sb').innerHTML=`<input type="file" id="sf" accept="image/*" style="margin-top:8px"><img id="sprev" ${img?`class="pic" src="${img}"`:'class="hidden"'}><input id="sc" maxlength="100" placeholder="Keterangan (opsional)" style="margin-top:6px">`;$('#sf').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{$('#se').textContent='Memproses foto…';img=await pack(f,900);$('#se').textContent='';$('#sprev').src=img;$('#sprev').className='pic'}catch(x){$('#se').textContent='Foto gagal: '+x.message}}}};
$('#mt').onclick=()=>{mode='text';body()};$('#mi').onclick=()=>{mode='image';body()};$('#mv').onclick=()=>{mode='video';body()};body();
$('#sp').onclick=async()=>{try{const at=Date.now(),d={uid:me.uid,name:me.name,type:mode,at,expiresAt:at+864e5};if(mode==='text'){const t=$('#st').value.trim();if(!t)return $('#se').textContent='Tulis sesuatu dulu.';d.text=t;d.bg=bg}else if(mode==='video'){if(!vfile)return $('#se').textContent='Pilih video dulu.';$('#se').textContent='Mengunggah video…';const data=await new Promise((ok,no)=>{const r=new FileReader();r.onerror=no;r.onload=()=>ok(r.result);r.readAsDataURL(vfile)});const ref=doc(collection(db,'statuses')),n=Math.ceil(data.length/700000);for(let k=0;k<n;k++)await setDoc(doc(db,'statuses',ref.id,'chunks',String(k).padStart(3,'0')),{uid:me.uid,i:k,d:data.slice(k*700000,(k+1)*700000)});d.chunks=n;d.text=$('#sc').value.trim();await setDoc(ref,d);closeOv();render();return}else{if(!img)return $('#se').textContent='Pilih foto dulu.';d.img=img;d.text=$('#sc').value.trim()}await addDoc(collection(db,'statuses'),d);closeOv();render()}catch(e){$('#se').textContent='Gagal kirim: '+e.message}}}

function accountScreen(){const bl=[...B()];
main.innerHTML=`<div class="card pn" style="text-align:center">${av(me,'big')}<div style="margin:10px 0"><button id="cph">Ganti foto profil</button><input type="file" id="ph" accept="image/*" class="hidden"></div><div class="sub">Kcat ID: <strong>${esc(me.kcatId)}</strong><br>Email: ${esc(auth.currentUser.email)}</div></div><div class="card pn"><label style="margin-top:0">Nama</label><input id="nm" maxlength="32" value="${esc(me.name)}"><label>Bio</label><input id="bio" maxlength="100" value="${esc(me.bio||'')}"><div id="ae" class="status"></div><button class="primary" id="sv" style="margin-top:10px;width:100%">Simpan profil</button></div><div class="card pn"><h3>Daftar blokir</h3><div class="list">${bl.map(u=>`<div class="item">${av(getU(u),'sm')}<span class="grow">${esc(getU(u).name)}</span><button data-ub="${esc(u)}">Buka blokir</button></div>`).join('')||'<div class="sub">Belum ada yang diblokir.</div>'}</div></div><div class="card pn"><button id="nt" style="width:100%">🔔 Aktifkan notifikasi</button><p class="sub">Notifikasi muncul saat Kcat terbuka (termasuk di latar belakang browser). Saat aplikasi benar-benar ditutup, push butuh server tambahan.</p></div><button class="danger" id="so" style="width:100%">Keluar akun</button><div class="credit">Kcat · dibuat oleh <b>@Bus</b></div>`;
$('#cph').onclick=()=>$('#ph').click();
$('#ph').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{$('#ae').textContent='Memproses foto…';const d=await pack(f,256);await updateDoc(doc(db,'users',me.uid),{photo:d});$('#ae').className='status good';$('#ae').textContent='Foto profil diperbarui ✓';setTimeout(accountScreen,600)}catch(x){$('#ae').className='status bad';$('#ae').textContent='Gagal: '+x.message}};
$('#sv').onclick=async()=>{const n=$('#nm').value.trim();if(!n){$('#ae').className='status bad';return $('#ae').textContent='Nama tidak boleh kosong.'}try{await updateDoc(doc(db,'users',me.uid),{name:n,bio:$('#bio').value.trim()});await updateProfile(auth.currentUser,{displayName:n});$('#ae').className='status good';$('#ae').textContent='Profil disimpan ✓'}catch(e){$('#ae').className='status bad';$('#ae').textContent=e.message}};
main.querySelectorAll('[data-ub]').forEach(b=>b.onclick=async()=>{await updateDoc(doc(db,'users',me.uid),{blockedUids:arrayRemove(b.dataset.ub)});setTimeout(accountScreen,300)});$('#nt').onclick=async()=>{try{const p=await Notification.requestPermission();$('#nt').textContent=p==='granted'?'🔔 Notifikasi aktif':'Notifikasi ditolak di pengaturan browser'}catch(e){$('#nt').textContent='Browser ini tidak mendukung notifikasi'}};$('#so').onclick=()=>signOut(auth)}
if(!init())stuck('Gagal memulai Firebase. Cek internet lalu muat ulang.');
</script></body></html>
