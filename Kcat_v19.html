<style>
:root{color-scheme:dark;--bg:#171321;--pink:#f329a5;--purple:#a64cf3;--cyan:#16d7eb;--green:#32d583;--muted:#b9aecb}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 10% 0%,#392143,transparent 45%),var(--bg);color:#fff;font:15px system-ui,-apple-system,Segoe UI,sans-serif}
.app{max-width:760px;margin:auto;min-height:100dvh;display:flex;flex-direction:column}
.hd{padding:14px 14px 10px;position:sticky;top:0;background:#1b1628f5;z-index:5;border-bottom:1px solid #ffffff12}
.brand{font-size:28px;font-weight:900;font-style:italic;text-shadow:2px 2px 0 var(--pink)}.sub{color:var(--muted);font-size:12px}
.row{display:flex;gap:8px;align-items:center}.grow{flex:1;min-width:0}.hidden{display:none!important}
button,input,textarea{font:inherit}button{cursor:pointer;color:var(--btntx,#fff);border:1px solid #645173;border-radius:12px;padding:10px 12px;background:var(--btnbg,#322641)}
button.primary{border:0;background:var(--btnpri,linear-gradient(135deg,var(--pink),var(--purple)));font-weight:800}button.danger{border-color:#a43d64;color:#ff9ab9;background:#322641}
input,textarea{width:100%;background:#0d0a13;border:1px solid #514361;color:#fff;border-radius:12px;padding:12px;outline-color:var(--cyan)}
label{display:block;color:var(--muted);font-size:12px;margin:12px 0 6px}
#q{margin-top:10px;border:2px solid #09070f;box-shadow:3px 3px 0 #000}
.tabs{display:flex;gap:6px;margin-top:10px;background:#0d0a13;border:2px solid #09070f;border-radius:16px;padding:6px}
.tabs button{flex:1;position:relative;padding:8px 2px;font-size:12px;border:0;background:none;color:var(--muted)}
.tabs button span{display:block;font-size:17px}.tabs button.active{background:var(--btnpri,linear-gradient(135deg,var(--pink),var(--purple)));color:var(--btntx,#fff);font-weight:800}
.tabs b{position:absolute;top:0;right:2px;background:var(--cyan);color:#000;font-size:10px;border-radius:9px;padding:1px 5px}.tabs b:empty{display:none}
.status{font-size:12px;margin-top:8px}.good{color:var(--green)}.bad{color:#ff8eb7}
main{padding:14px;flex:1}.list{display:flex;flex-direction:column;gap:9px}
.card,.item{background:#241b35;border:2px solid #09070f;box-shadow:3px 3px 0 #000;border-radius:16px}.pn{padding:14px;margin-bottom:12px}
.item{display:flex;align-items:center;gap:12px;text-align:left;width:100%;padding:12px;color:#fff}.item small{display:block;color:var(--muted);margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.av{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,var(--pink),var(--purple));font-weight:900;flex-shrink:0;object-fit:cover;border:2px solid #09070f}
.av.sm{width:36px;height:36px}.av.big{width:96px;height:96px;font-size:36px}.av.ring{border:3px solid var(--cyan)}
.big{font-size:20px}h2,h3{margin:6px 0}
.rh{margin-bottom:8px;position:sticky;top:0;background:#171321;padding:6px 0;z-index:3}
.messages{display:flex;flex-direction:column;gap:7px;min-height:50vh;padding:10px 0}
.msg{max-width:84%;align-self:flex-start;background:#382d48;padding:8px 11px;border-radius:14px;overflow-wrap:anywhere;white-space:pre-wrap}
.msg.mine{align-self:flex-end;background:linear-gradient(135deg,#963ee0,#d92b9b)}.msg small{display:block;opacity:.7;font-size:10px;margin-top:3px}.msg strong{font-size:12px;color:var(--cyan)}
.pic{max-width:100%;max-height:260px;border-radius:10px;display:block;margin:4px 0}
.compose{display:flex;gap:6px;position:sticky;bottom:0;background:#171321;padding:8px 0 calc(8px + env(safe-area-inset-bottom))}.compose textarea{resize:none;min-height:44px;max-height:110px}
#ov{position:fixed;inset:0;z-index:20}#ov.ovm{background:#000a;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:#241b35;border-radius:20px 20px 0 0;padding:16px;width:100%;max-width:760px;max-height:88dvh;overflow:auto;display:flex;flex-direction:column;gap:8px}
.sv{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;align-items:center}
.svh{position:absolute;top:24px;left:12px;right:12px;z-index:3}.bars{position:absolute;top:10px;left:10px;right:10px;display:flex;gap:4px;z-index:3}
.bars i{flex:1;height:3px;background:#fff4;border-radius:2px;overflow:hidden;position:relative}.bars i.d{background:#fff}.bars i.a::after{content:"";position:absolute;inset:0;background:#fff;animation:p 5s linear forwards;transform-origin:left}
@keyframes p{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.stext{font-size:28px;font-weight:800;text-align:center;padding:30px;overflow-wrap:anywhere}.simg{max-width:100%;max-height:100%;object-fit:contain}.scap{position:absolute;bottom:30px;background:#0009;padding:8px 14px;border-radius:12px;max-width:90%}
.tapl,.tapr{position:absolute;top:80px;bottom:0;z-index:2}.tapl{left:0;width:33%}.tapr{right:0;width:67%}
.sw{display:flex;gap:8px;margin:8px 0}.sw i{width:34px;height:34px;border-radius:50%;border:3px solid transparent;cursor:pointer}.sw i.on{border-color:#fff}
.dot{background:var(--cyan);color:#000;font-size:11px;font-weight:800;border-radius:10px;padding:1px 7px;margin-left:6px}
#toast{position:fixed;top:10px;left:10px;right:10px;max-width:740px;margin:auto;z-index:30;background:linear-gradient(135deg,var(--pink),var(--purple));padding:12px 14px;border-radius:14px;font-weight:700;box-shadow:3px 3px 0 #000;cursor:pointer;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.by{position:absolute;top:0;right:12px;background:linear-gradient(135deg,var(--pink),var(--purple));color:#fff;font-size:11px;font-weight:800;padding:3px 10px 4px;border-radius:0 0 10px 10px;border:2px solid #09070f;border-top:0;box-shadow:2px 2px 0 #000;letter-spacing:.3px}
.credit{text-align:center;color:#9f94b1;font-size:12px;margin-top:14px}.credit b{color:var(--pink)}
html{scroll-behavior:smooth}
.tabs{overflow-x:auto;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}.tabs button{flex:0 0 auto;min-width:64px;white-space:nowrap}
@keyframes in{from{opacity:0;transform:translateY(14px) scale(.985)}to{opacity:1;transform:none}}
@keyframes slin{from{opacity:0;transform:translateX(28px)}to{opacity:1;transform:none}}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
@keyframes pop{from{opacity:0;transform:scale(.92) translateY(6px)}to{opacity:1;transform:none}}
main.anim>*{animation:in .34s cubic-bezier(.2,.8,.2,1) both}main.anim>*:nth-child(2){animation-delay:.05s}main.anim>*:nth-child(3){animation-delay:.1s}main.anim>*:nth-child(n+4){animation-delay:.15s}
main.room>*{animation:slin .28s cubic-bezier(.2,.8,.2,1) both}
.sheet{animation:up .3s cubic-bezier(.2,.8,.2,1)}#ov.ovm{animation:fade .2s ease}@keyframes fade{from{opacity:0}to{opacity:1}}
button{transition:transform .12s,background .25s,box-shadow .25s,opacity .2s}button:active{transform:scale(.95)}.item:active{transform:scale(.985)}
.messages .msg:last-child{animation:pop .24s ease both}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.sgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.sk{position:relative}.sk img{width:100%;border-radius:12px;background:#0d0a13;cursor:pointer}.sk b{position:absolute;top:-4px;right:-4px;background:#a43d64;border-radius:50%;width:20px;height:20px;display:grid;place-items:center;font-size:11px;cursor:pointer}
.stk{width:140px;height:140px;border-radius:14px;display:block;object-fit:cover}.msg.nobg{background:none!important;padding:0}
.mention{color:var(--cyan);font-weight:800}.mine .mention{color:#fff;text-decoration:underline}
.vbtn{background:#0d0a13;border:1px solid #645173;margin:4px 0;width:100%}
#dock{position:fixed;right:10px;bottom:84px;z-index:15;background:#241b35;border:2px solid #09070f;box-shadow:3px 3px 0 #000;border-radius:14px;padding:8px;max-width:240px;animation:in .3s ease}#dock .row button{padding:4px 8px}#dt{font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#mn{display:flex;gap:6px;flex-wrap:wrap;padding:4px 0}#mn button{padding:4px 10px;font-size:13px}
.about a{color:var(--cyan)}.bnr{height:90px;border-radius:12px;background:linear-gradient(135deg,#f329a5,#a64cf3) center/cover;margin-bottom:-34px}
main .card .av.big{position:relative;border:3px solid #241b35}
/* ===== KCAT V16 ===== */
.by{display:flex;gap:8px;white-space:nowrap}
.about p{line-height:1.55}
.nc{font-weight:800}
.nc-red{color:#ff2b2b}.nc-orange{color:#ff8c00}.nc-green{color:#2ecc40}
.nc-white{color:#fff}.nc-gray{color:#808080}.nc-yellow{color:#ffe600}.nc-cream{color:#f5f5dc}.nc-lightblue{color:#7dd3fc}
.nc-black{color:#000;text-shadow:0 0 2px #fff,0 0 6px #fffb}
.nc-navy{color:#000080;text-shadow:0 0 3px #fff,0 0 7px #fff9}
.nc-brown{color:#a52a2a;text-shadow:0 0 4px #fff8}
.nc-darkgray{color:#4a4a4a;text-shadow:0 0 3px #fff,0 0 6px #fff9}
.nc-redmoon{color:#c1121f;text-shadow:0 0 6px #ff4d4d99,0 0 1px #fff5}

const own=(m,k)=>Object.prototype.hasOwnProperty.call(m,k);
const NC_LABEL={red:'Merah',orange:'Oranye',green:'Hijau',rgb:'Merah, Biru, Hijau',white:'Putih',black:'Hitam',gray:'Abu-abu',yellow:'Kuning',brown:'Cokelat',navy:'Navy Blue',cream:'Cream',lightblue:'Biru Muda',darkgray:'Abu-abu Gelap',redmoon:'Merah Darah (eksklusif)',gold:'Emas RGB (eksklusif)'};
/* kode standar (dinormalisasi: tanpa '#', huruf kecil) */
const NC_STD={cff1000:'red',cff8000:'orange',c0aba1d:'green',gamer_123:'rgb',cffcffcff:'white','000000':'black','808080':'gray',cffcff00:'yellow',a52a2a:'brown','000080':'navy',f5f5dc:'cream',ogmember:'lightblue',trooll:'darkgray'};
/* kode eksklusif disimpan sebagai hash SHA-256 agar tidak terbaca di source */
const NC_EXC={'4b8c2333c3e4983f0ac7367d97c57b2873e7422ac2ead0c572514a76d91255a4':'redmoon','f70202e714ed762c80b2d5a07b958940f854a2fa99bf9d877704d058dcceb2b6':'gold'};

function sha256(str){const b=new TextEncoder().encode(str),l=b.length,w=new Uint32Array(64),K=[],S=[];let p=2,n=0;while(n<64){let ok=1;for(let d=2;d*d<=p;d++)if(p%d===0){ok=0;break}if(ok){if(n<8)S[n]=(Math.pow(p,.5)%1)*4294967296|0;K[n]=(Math.pow(p,1/3)%1)*4294967296|0;n++}p++}
const nb=(l+9+63)>>6,buf=new Uint8Array(nb*64);buf.set(b);buf[l]=128;const dv=new DataView(buf.buffer);dv.setUint32(nb*64-4,(l*8)>>>0);dv.setUint32(nb*64-8,Math.floor(l*8/4294967296));
const R=(x,k)=>(x>>>k)|(x<<(32-k));
for(let i=0;i<nb;i++){for(let j=0;j<16;j++)w[j]=dv.getUint32(i*64+j*4);for(let j=16;j<64;j++){const a=w[j-15],c=w[j-2];w[j]=(w[j-16]+(R(a,7)^R(a,18)^(a>>>3))+w[j-7]+(R(c,17)^R(c,19)^(c>>>10)))|0}
let [a,b2,c,d,e,f,g,h]=S;for(let j=0;j<64;j++){const t1=(h+(R(e,6)^R(e,11)^R(e,25))+((e&f)^(~e&g))+K[j]+w[j])|0,t2=((R(a,2)^R(a,13)^R(a,22))+((a&b2)^(a&c)^(b2&c)))|0;h=g;g=f;f=e;e=(d+t1)|0;d=c;c=b2;b2=a;a=(t1+t2)|0}
S[0]=(S[0]+a)|0;S[1]=(S[1]+b2)|0;S[2]=(S[2]+c)|0;S[3]=(S[3]+d)|0;S[4]=(S[4]+e)|0;S[5]=(S[5]+f)|0;S[6]=(S[6]+g)|0;S[7]=(S[7]+h)|0}
return S.map(x=>(x>>>0).toString(16).padStart(8,'0')).join('')}

/* --- Redeem warna nama --- */
async function redeemName(raw,o){
const k=String(raw).trim().replace(/^#/,'').toLowerCase();let key=own(NC_STD,k)?NC_STD[k]:null,excl=false;
if(!key){const h=sha256(k);if(own(NC_EXC,h)){key=NC_EXC[h];excl=true}}
if(!key)return false;
const done=(t,ok)=>{o.className='status '+(ok?'good':'bad');o.textContent=t};
try{
if(excl){
const r=await runTransaction(db,async t=>{const cr=doc(db,'claims',key),s=await t.get(cr);if(s.exists()&&s.data().uid!==me.uid)return'taken';if(!s.exists())t.set(cr,{uid:me.uid,reward:key,at:serverTimestamp()});t.update(doc(db,'users',me.uid),{nameColor:key});return s.exists()?'again':'new'});
if(r==='taken'){done('Kode eksklusif ini sudah diklaim pengguna lain.');return true}
done(r==='new'?'Redeem berhasil! Warna eksklusif '+NC_LABEL[key]+' sekarang milikmu.':'Kode ini sudah kamu klaim sebelumnya. Warna diterapkan lagi.',true)
}else{await updateDoc(doc(db,'users',me.uid),{nameColor:key});done('Redeem berhasil! Warna nama: '+NC_LABEL[key],true)}
const n=$('#knm');if(n)n.innerHTML=nameHtml({...me,nameColor:key});const l=$('#kncl');if(l)l.textContent='Warna nama saat ini: '+NC_LABEL[key]
}catch(e){done('Gagal redeem: '+e.message)}
return true}

const hl=(t,r)=>{const nm=new Set((r.memberUids||[]).map(u=>String(getU(u).name).replace(/\s+/g,'_').toLowerCase()));return bold(t).replace(/@([^\s<]+)/g,(x,n)=>nm.has(n.replace(/[.,!?;:]+$/,'').toLowerCase())?`<span class="mention">${x}</span>`:x)};
function mentionSuggest(r){const box=$('#mn');if(!box)return;const rr=rooms.find(x=>x.id===r.id)||r;if(rr.type!=='group'){box.classList.add('hidden');return}const t=$('#text'),v=t.value.slice(0,t.selectionStart),m=v.match(/@(\S*)$/);if(!m){box.classList.add('hidden');return}const k=m[1].toLowerCase();
const c=rr.memberUids.filter(u=>u!==me.uid).map(u=>({u,n:String(getU(u).name||'')})).filter(x=>x.n.toLowerCase().replace(/\s+/g,'_').includes(k)).slice(0,5);if(!c.length){box.classList.add('hidden');return}
box.classList.remove('hidden');box.innerHTML=c.map(x=>`<button data-mn="${esc(x.n.replace(/\s+/g,'_'))}">@${esc(x.n)}</button>`).join('');
box.querySelectorAll('[data-mn]').forEach(b=>b.onclick=()=>{const pos=t.selectionStart,bf=t.value.slice(0,pos).replace(/@\S*$/,'@'+b.dataset.mn+' ');t.value=bf+t.value.slice(pos);box.classList.add('hidden');t.focus()})}

async function delMsg(rid,d){const m=d.data?d.data():d;if(m.vid){const c=await getDocs(collection(db,'rooms',rid,'messages',d.id,'chunks'));await Promise.all(c.docs.map(x=>deleteDoc(x.ref)))}await deleteDoc(d.ref||doc(db,'rooms',rid,'messages',d.id))}
async function blockedBy(r){if(r.type!=='private')return'';const o=other(r);if(B().has(o))return'Kamu memblokir pengguna ini.';try{const od=await withTimeout(getDoc(doc(db,'users',o)),2000);if((od.data()?.blockedUids||[]).includes(me.uid))return'Pesan tidak bisa dikirim ke pengguna ini.'}catch(_){}return''}
async function sendVideo(r,f){const bb=await blockedBy(r);if(bb)throw Error(bb);const data=await new Promise((ok,no)=>{const fr=new FileReader();fr.onerror=no;fr.onload=()=>ok(fr.result);fr.readAsDataURL(f)});const n=Math.ceil(data.length/700000),ref=doc(collection(db,'rooms',r.id,'messages'));
for(let k=0;k<n;k++)await setDoc(doc(db,'rooms',r.id,'messages',ref.id,'chunks',String(k).padStart(3,'0')),{uid:me.uid,i:k,d:data.slice(k*700000,(k+1)*700000)});
await setDoc(ref,{uid:me.uid,name:me.name,text:'',vid:{n,mb:+(f.size/1048576).toFixed(1)},createdAt:serverTimestamp()});
await updateDoc(doc(db,'rooms',r.id),{lastText:'🎬 Video',lastAt:serverTimestamp(),lastUid:me.uid,hiddenFor:[]})}
async function playChatVid(rid,mid){modal('<div id="vb" class="sub">Memuat video…</div>');try{let u=vcache.get('m'+mid);if(!u){const c=await getDocs(query(collection(db,'rooms',rid,'messages',mid,'chunks'),orderBy('i')));const b=await(await fetch(c.docs.map(d=>d.data().d).join(''))).blob();u=URL.createObjectURL(b);vcache.set('m'+mid,u)}const box=$('#vb');if(!box)return;box.innerHTML='<video controls autoplay playsinline style="width:100%;border-radius:12px"></video>';box.firstChild.src=u}catch(e){const box=$('#vb');if(box)box.textContent='Gagal memuat video: '+e.message}}

function makeSticker(back){modal('<h3>Buat stiker</h3><input type="file" id="kf" accept="image/*"><input id="kt" maxlength="24" placeholder="Teks di stiker (opsional)"><canvas id="kc" width="256" height="256" style="width:160px;height:160px;border-radius:12px;background:#0d0a13;align-self:center"></canvas><div id="ke" class="status bad"></div><button class="primary" id="ks">Simpan stiker</button>');let im=null;
const draw=()=>{const c=$('#kc'),x=c.getContext('2d');x.clearRect(0,0,256,256);if(!im)return;const k=Math.max(256/im.width,256/im.height),w=im.width*k,h=im.height*k;x.drawImage(im,(256-w)/2,(256-h)/2,w,h);const t=$('#kt').value.trim();if(t){x.font='bold 30px system-ui,sans-serif';x.textAlign='center';x.lineWidth=7;x.strokeStyle='#000';x.fillStyle='#fff';x.strokeText(t,128,236,240);x.fillText(t,128,236,240)}};
$('#kf').onchange=e=>{const f=e.target.files[0];if(!f)return;const fr=new FileReader();fr.onload=()=>{im=new Image();im.onload=draw;im.src=fr.result};fr.readAsDataURL(f)};$('#kt').oninput=draw;
$('#ks').onclick=async()=>{if(!im)return $('#ke').textContent='Pilih gambar dulu.';try{let d=$('#kc').toDataURL('image/webp',.85);if(!d.startsWith('data:image/webp'))d=$('#kc').toDataURL('image/png');await addDoc(collection(db,'users',me.uid,'stickers'),{d,at:Date.now()});back()}catch(e){$('#ke').textContent='Gagal: '+e.message}}}

function coverToData(f,w,h,qa){return new Promise((ok,no)=>{const r=new FileReader();r.onerror=no;r.onload=()=>{const im=new Image();im.onerror=no;im.onload=()=>{const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d'),k=Math.max(w/im.width,h/im.height),iw=im.width*k,ih=im.height*k;x.drawImage(im,(w-iw)/2,(h-ih)/2,iw,ih);ok(c.toDataURL('image/jpeg',qa))};im.src=r.result};r.readAsDataURL(f)})}

const d=u.createdAt&&u.createdAt.toDate?u.createdAt.toDate().toLocaleDateString('id-ID',{day:'numeric',month:'long',year:'numeric'}):'—';
modal(`<div id="pbn" style="margin:-16px -16px 0;height:120px;border-radius:20px 20px 0 0;background:${u.banner?`url('${esc(u.banner)}') center/cover`:'linear-gradient(135deg,#f329a5,#a64cf3)'}"></div><div class="row" style="margin-top:-44px;padding:0 4px">${av(u,'big')}</div><h3>${nameHtml(u)}</h3><div class="sub">${esc(u.kcatId||'')}</div><p>${esc(u.bio||'—')}</p><div class="sub" id="pdt">📅 Akun dibuat: ${esc(d)}</div>`)}

function bootDone(){if(bootEl.style.display!=='flex')return;setTimeout(()=>{if(!bootEl.firstChild)return;clearInterval(bootI);bootP=100;bootPaint();setTimeout(bootHide,500)},Math.max(0,1700-(Date.now()-bootAt)))}

function rulesScreen(){const R=[['🤝','Saling hormat','Bercanda boleh, tapi jangan sampai merendahkan orang lain. Hinaan, ejekan soal suku, agama, dan ras, serta serangan pribadi tidak dibiarkan.'],['🚫','Jangan spam','Global Chat dibatasi 500 karakter per pesan dan ada jeda 2 detik. Jangan banjiri chat, jangan kirim hal yang sama berulang-ulang, dan jangan mention orang tanpa alasan.'],['🔒','Jaga privasi','Jangan menyebar nomor HP, alamat, foto, atau data pribadi orang lain tanpa izin. Jangan juga memberi password atau kode verifikasimu ke siapa pun, termasuk yang mengaku admin.'],['⛔','Konten terlarang','Dilarang konten porno, kekerasan ekstrem, judi, penipuan, dan link berbahaya. Jangan kirim file atau link yang bisa mencuri akun orang.'],['🪪','Akun sendiri','Satu orang, satu akun yang jujur. Jangan menyamar jadi admin atau owner, dan jangan menjual atau meminjamkan akunmu.'],['🎁','Kode redeem','Kode redeem hanya untuk akunmu sendiri. Jangan membagikan kode khusus pengelola, dan jangan menebak kode atau mencari celah buat jadi admin.'],['📢','Announcement dan komentar','Pengumuman hanya diterbitkan pengelola. Komentar di bawahnya boleh dipakai untuk berpendapat, tapi tetap ikut aturan di atas.'],['🥾','Kalau melanggar','Akun bisa di-kick atau di-ban oleh admin. Ban berlaku sampai ke Gmail yang dipakai, jadi pikir dulu sebelum bikin onar.'],['🛟','Ada yang mengganggu?','Blokir orangnya lewat menu ⋮ di chat pribadi, lalu laporkan ke admin lewat channel yang ada di About us. Sertakan screenshot supaya cepat ditindak.']];
main.innerHTML=`<h2>📜 Aturan Chat</h2><p class="sub">Biar nongkrong di KCAT tetap enak buat semua.</p>${R.map((r,i)=>`<section class="card pn"><h3>${i+1}. ${r[0]} ${esc(r[1])}</h3><p>${esc(r[2])}</p></section>`).join('')}<p class="sub" style="text-align:center">Dengan memakai KCAT, kamu setuju dengan aturan ini.</p>`}
/* pinUn,isSug already declared */
const bold=t=>{t=String(t==null?'':t);let o='',l=0,m;const re=/#([^#\s](?:[^#\n]*?[^#\s])?)#/g;while((m=re.exec(t))){o+=esc(t.slice(l,m.index))+'<b>'+esc(m[1])+'</b>';l=re.lastIndex}return o+esc(t.slice(l))};
function pinWatch(r){if(pinUn){pinUn();pinUn=null}const can=r.type==='private'||r.createdBy===me.uid;pinUn=onSnapshot(doc(db,'rooms',r.id),d=>{const e=$('#pinb');if(!e)return;const p=d.exists()&&d.data().pinned;if(!p){e.className='hidden';e.innerHTML='';return}e.className='status good';e.style.cursor='pointer';e.innerHTML=`📌 <b>${esc(p.name)}</b>: ${esc(p.text)}${can?' <button id="pnx">Lepas</button>':''}`;e.onclick=ev=>{if(ev.target.id==='pnx')return;jumpTo(p.id)};if(can)$('#pnx').onclick=ev=>{ev.stopPropagation();updateDoc(doc(db,'rooms',r.id),{pinned:null}).catch(x=>tip(fmsg(x.message)))}},()=>{})}
function stCom(s,back){clearTimeout(timer);const bx=document.createElement('div');bx.style.cssText='position:absolute;left:0;right:0;bottom:0;max-height:72%;display:flex;flex-direction:column;gap:8px;padding:12px;background:#12101ef5;border-radius:18px 18px 0 0;z-index:20';
bx.innerHTML=`<div class="row"><b class="grow">💬 Komentar</b><button id="cx2">✕</button></div><div id="cl2" style="overflow:auto;min-height:90px;flex:1"></div><div class="row"><input id="ci2" class="grow" maxlength="200" placeholder="Tulis komentar…"><button class="primary" id="cs2">Kirim</button></div>`;(ov.querySelector('.sv')||ov).appendChild(bx);
const un=onSnapshot(query(collection(db,'statuses',s.id,'comments'),orderBy('createdAt','asc'),limit(100)),sn=>{const l=$('#cl2');if(!l)return;l.innerHTML=sn.docs.map(d=>{const m=d.data(),u=getU(m.uid);return `<div class="row" style="gap:8px;align-items:flex-start;margin:6px 0">${av(u,'sm')}<div class="grow"><strong>${nameHtml({name:m.name||u.name,nameColor:u.nameColor})}</strong> <small>${m.createdAt?T(m.createdAt):''}</small><div>${nl(m.text)}</div></div>${m.uid===me.uid||s.uid===me.uid?`<a href="#" data-d="${d.id}">Hapus</a>`:''}</div>`}).join('')||'<div class="sub">Belum ada komentar.</div>';l.scrollTop=l.scrollHeight;l.querySelectorAll('[data-d]').forEach(a=>a.onclick=e=>{e.preventDefault();deleteDoc(doc(db,'statuses',s.id,'comments',a.dataset.d)).catch(x=>tip(fmsg(x.message)))})},e=>{const l=$('#cl2');if(l)l.textContent='Gagal memuat: '+fmsg(e.message)});
$('#cx2').onclick=()=>{un();bx.remove();back()};let lc=0;$('#cs2').onclick=async()=>{const i=$('#ci2'),t=i.value.trim();if(!t||Date.now()-lc<2000)return;lc=Date.now();i.value='';try{await addDoc(collection(db,'statuses',s.id,'comments'),{uid:me.uid,name:me.name||'Pengguna',text:t,createdAt:serverTimestamp()})}catch(e){i.value=t;tip('Gagal kirim: '+fmsg(e.message))}}}
function merpatiHtml(){return `<section class="card pn"><h3>🕊️ Merpati Perdamaian</h3><p class="sub">Punya ide, kritik, atau saran untuk KCAT? Kirim pesanmu di sini agar tim KCAT dapat membacanya dan membuat platform ini menjadi lebih baik.</p>${me?`<input id="mpn" maxlength="40" placeholder="Nama" value="${esc(me.name||'')}"><textarea id="mpt" rows="4" maxlength="1000" placeholder="Isi pesan (saran, kritik, atau masukan)"></textarea><div id="mps" class="status"></div><button class="primary" onclick="mpSend()">Kirim Saran</button>`:'<p class="sub">Masuk dulu untuk mengirim saran.</p>'}</section>`}
window.mpSend=async()=>{const n=$('#mpn').value.trim(),t=$('#mpt').value.trim(),o=$('#mps');const w=Date.now()-(window._mpl||0);if(!n||!t){o.className='status bad';o.textContent='Nama dan isi pesan wajib diisi.';return}if(w<30000){o.className='status bad';o.textContent='Tunggu sebentar sebelum mengirim lagi.';return}
try{await addDoc(collection(db,'suggestions'),{uid:me.uid,name:n,text:t,status:'new',createdAt:serverTimestamp()});window._mpl=Date.now();$('#mpt').value='';o.className='status good';o.textContent='Saran terkirim. Terima kasih! 🕊️'}catch(e){o.className='status bad';o.textContent='Gagal mengirim: '+fmsg(e.message)}};
function syncInbox(){const b=$('#tabInbox');if(b)b.style.display=isSug?'':'none'}
function inboxScreen(){stopG();if(!isSug){main.innerHTML='<section class="card pn"><h2>📨 Kotak Saran</h2><p class="sub bad">Kamu tidak punya akses ke halaman ini.</p></section>';return}let docs=[],f='all';
main.innerHTML=`<h2>📨 Kotak Saran</h2><input id="iq" placeholder="Cari nama atau isi…"><div class="row"><button data-f="all" class="primary">Semua</button><button data-f="new">Baru</button><button data-f="reviewed">Ditinjau</button><button data-f="archived">Arsip</button></div><div class="list" id="il"><div class="sub">Memuat…</div></div>`;
const paint=()=>{const q=$('#iq').value.trim().toLowerCase(),l=$('#il');if(!l)return;const a=docs.filter(d=>(f==='all'?d.status!=='archived':(d.status||'new')===f||(f==='new'&&d.status==='read'&&false))).filter(d=>!q||((d.name||'')+' '+(d.text||'')).toLowerCase().includes(q));
l.innerHTML=a.map(d=>`<div class="card pn"><strong>${esc(d.name)}</strong> <small class="sub">${fdt(d.createdAt)} · ${esc({new:'Baru',read:'Dibaca',reviewed:'Ditinjau',archived:'Arsip'}[d.status||'new']||d.status)}</small><div style="margin:6px 0">${nl(d.text)}</div><div class="row"><button data-s="read" data-i="${d.id}">Dibaca</button><button data-s="reviewed" data-i="${d.id}">Ditinjau</button><button data-s="archived" data-i="${d.id}">Arsipkan</button><button class="danger" data-x="${d.id}">Hapus</button></div></div>`).join('')||'<div class="card pn sub">Belum ada saran.</div>';
l.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>updateDoc(doc(db,'suggestions',b.dataset.i),{status:b.dataset.s}).catch(e=>tip(fmsg(e.message))));l.querySelectorAll('[data-x]').forEach(b=>b.onclick=()=>{if(confirm('Hapus saran ini?'))deleteDoc(doc(db,'suggestions',b.dataset.x)).catch(e=>tip(fmsg(e.message)))})};
$('#iq').oninput=paint;main.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{f=b.dataset.f;main.querySelectorAll('[data-f]').forEach(x=>x.classList.toggle('primary',x===b));paint()});
gUnsub=onSnapshot(query(collection(db,'suggestions'),orderBy('createdAt','desc'),limit(200)),s=>{docs=s.docs.map(d=>({id:d.id,...d.data()}));paint()},e=>{const l=$('#il');if(l)l.innerHTML='<div class="card pn sub bad">Gagal memuat: '+esc(fmsg(e.message))+'</div>'})}
function fmsg(m){m=String(m==null?'':m);if(/INTERNAL ASSERTION FAILED/.test(m)){recover();return 'Koneksi ke server terganggu, menyambungkan ulang…'}return m}
function recover(){try{const k='kcatRec',t=+sessionStorage.getItem(k)||0;if(Date.now()-t>60000){sessionStorage.setItem(k,String(Date.now()));setTimeout(()=>location.reload(),700)}}catch(_){}}
if(!init())stuck('Gagal memulai Firebase. Cek internet lalu muat ulang.');
</script></body></html>
